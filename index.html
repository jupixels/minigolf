<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Tiny Tees — a 12-hole mini golf game with boost pads, portals, hills, ice, gems and local multiplayer.">
<title>Tiny Tees — Mini Golf</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="firebase-config.js"></script>
<script type="module" src="community.js"></script>
<style>
  :root {
    --ink:#f6f3e8; --dim:rgba(246,243,232,.65); --accent:#ffd34e; --accent-d:#c3920f;
    --panel:#143826; --panel2:#1c4a34; --line:rgba(255,255,255,.14); --gem:#7fe0ff;
  }
  * { box-sizing:border-box; }
  html, body {
    margin:0; height:100%; overflow:hidden; color:var(--ink);
    background:#0a1d14 radial-gradient(ellipse at 50% -10%, #23573c 0%, #0f2b1e 45%, #081710 100%);
    font-family:Fredoka, "Trebuchet MS", system-ui, sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #app { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:8px; gap:8px; }

  /* ---------- HUD ---------- */
  #hud {
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:16px; padding:6px 8px 6px 14px;
  }
  .hole-info { display:flex; align-items:baseline; gap:10px; min-width:0; }
  .hole-num { font-weight:700; font-size:20px; color:var(--accent); white-space:nowrap; }
  .hole-name { font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .par { font-size:13px; color:var(--dim); white-space:nowrap; }
  #players { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.06); font-size:14px; opacity:.55; transition:all .2s; white-space:nowrap; }
  .chip.active { opacity:1; background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 2px var(--c); }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--c); box-shadow:0 0 0 2px rgba(255,255,255,.55); flex:none; }
  .right { display:flex; align-items:center; gap:6px; }
  .gems { font-weight:600; padding:5px 11px; border-radius:999px; background:rgba(127,224,255,.14); color:var(--gem); white-space:nowrap; }
  .gems.pop { animation:pop .4s; }
  @keyframes pop { 50% { transform:scale(1.25); } }

  button {
    font:inherit; font-weight:600; cursor:pointer; border:none; border-radius:14px;
    padding:10px 18px; background:var(--accent); color:#2a2100; box-shadow:0 4px 0 var(--accent-d);
    transition:transform .06s, filter .15s;
  }
  button:hover { filter:brightness(1.08); }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--accent-d); }
  button:disabled { filter:grayscale(1) brightness(.7); cursor:not-allowed; }
  button.ghost { background:rgba(255,255,255,.12); color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.35); }
  button.icon { width:38px; height:38px; padding:0; font-size:17px; border-radius:12px; }
  button.big { font-size:22px; padding:14px 34px; }

  #wrap { position:relative; border-radius:16px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.55); }
  canvas { display:block; touch-action:none; cursor:crosshair; }

  /* ---------- Overlay ---------- */
  #overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(6,20,13,.55); backdrop-filter:blur(2px); padding:12px; z-index:2;
  }
  #overlay.hidden { display:none; }
  .card {
    background:linear-gradient(180deg, var(--panel2), var(--panel)); border:2px solid var(--line);
    border-radius:20px; padding:18px 22px; text-align:center; max-width:100%; max-height:100%; overflow:auto;
    box-shadow:0 20px 40px rgba(0,0,0,.45); animation:rise .25s ease-out;
  }
  @keyframes rise { from { transform:translateY(14px) scale(.97); opacity:0; } }
  .logo { margin:0; font-size:clamp(34px,7vw,62px); font-weight:700; color:var(--accent); line-height:1; letter-spacing:1px; text-shadow:0 5px 0 rgba(0,0,0,.35); }
  .tag { margin:4px 0 14px; color:var(--dim); font-size:15px; }
  .card h2 { margin:0 0 6px; font-size:clamp(22px,4vw,32px); }
  .card h3 { margin:12px 0 6px; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); font-weight:500; }
  .card p { margin:6px 0 12px; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .seg { display:inline-flex; background:rgba(0,0,0,.3); border-radius:14px; padding:4px; gap:4px; }
  .seg button { background:transparent; color:var(--ink); box-shadow:none; padding:7px 14px; border-radius:10px; }
  .seg button.on { background:var(--accent); color:#2a2100; }
  .muted { font-size:13px; color:var(--dim); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:8px; margin:10px 0; min-width:min(560px, 80vw); }
  .tile { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 8px; background:rgba(255,255,255,.07); color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.3); border-radius:14px; }
  .tile .tn { font-size:22px; font-weight:700; color:var(--accent); line-height:1; }
  .tile small { color:var(--dim); font-weight:400; }
  .tile.eq { box-shadow:inset 0 0 0 2px var(--accent), 0 3px 0 rgba(0,0,0,.3); }
  .swatch { width:34px; height:34px; border-radius:50%; box-shadow:inset -4px -5px 0 rgba(0,0,0,.18), 0 0 0 3px rgba(255,255,255,.25); }
  table { border-collapse:collapse; margin:8px auto 4px; font-size:14px; }
  td, th { border:1px solid rgba(255,255,255,.14); padding:4px 7px; min-width:28px; font-weight:500; }
  th { background:rgba(0,0,0,.22); }
  td.name { text-align:left; white-space:nowrap; }
  td.ace { background:#c99a14; color:#fff; } td.under { background:#2f7d4f; } td.even { background:rgba(255,255,255,.06); }
  td.over { background:#8a3b2e; } td.cur { outline:2px solid var(--accent); outline-offset:-2px; }
  .standings { list-style:none; padding:0; margin:10px auto; max-width:320px; text-align:left; }
  .standings li { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; background:rgba(255,255,255,.06); margin:6px 0; font-size:17px; }
  .standings li:first-child { background:rgba(255,211,78,.18); box-shadow:inset 0 0 0 2px var(--accent); }
  .standings .sc { margin-left:auto; font-weight:700; }
  .results { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:6px 0; }
  .results > span { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.07); padding:5px 10px; border-radius:999px; }
  .worlds { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; max-width:600px; margin:0 auto; }
  .world { display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 8px; border-radius:14px; color:#fff;
    box-shadow:0 3px 0 rgba(0,0,0,.35); opacity:.75; border:2px solid transparent; }
  .world.on { opacity:1; border-color:var(--accent); transform:translateY(-2px); }
  .world:disabled { filter:grayscale(.85) brightness(.6); opacity:.8; }
  .world .we { font-size:26px; line-height:1; }
  .world small { font-weight:400; font-size:11.5px; opacity:.85; line-height:1.25; }
  .w-green { background:linear-gradient(160deg, #3f9d4a, #22603a); }
  .w-desert { background:linear-gradient(160deg, #d0864a, #8e4423); }
  .w-cosmic { background:linear-gradient(160deg, #4b2a8f, #150f3a); }
  .unlock { margin:12px auto; padding:12px 16px; border-radius:14px; max-width:360px; animation:glow 1.2s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow:0 0 0 2px var(--accent); } to { box-shadow:0 0 22px 4px var(--accent); } }
  @media (max-width:560px){ .worlds { grid-template-columns:1fr; } .world small { display:none; } }
  .hint { font-size:13px; color:var(--dim); margin-top:12px; }

  /* ---------- Editor ---------- */
  #edTop, #edTools, #edPanel { display:none; }
  body.editing #hud { display:none; }
  body.editing #edTop { display:flex; }
  body.editing #edTools { display:grid; }
  body.editing #edPanel { display:block; }
  #stage { display:flex; gap:8px; align-items:flex-start; justify-content:center; max-width:100%; }
  #edTop { align-items:center; gap:6px; flex-wrap:wrap; width:100%; background:rgba(0,0,0,.32); border:1px solid var(--line); border-radius:16px; padding:6px 8px; }
  #edTop button { padding:7px 12px; font-size:14px; }
  #edTop button.icon { padding:0; }
  #edName { font:inherit; font-weight:600; background:rgba(255,255,255,.1); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:7px 10px; width:170px; }
  #edHoles { display:flex; gap:4px; flex-wrap:wrap; }
  #edHoles button { padding:6px 11px; border-radius:10px; background:rgba(255,255,255,.1); color:var(--ink); box-shadow:none; }
  #edHoles button.on { background:var(--accent); color:#2a2100; }
  #edSnap.on { background:rgba(255,211,78,.25); box-shadow:inset 0 0 0 2px var(--accent); }
  #edSaved { font-size:12px; min-width:58px; }
  .spacer { flex:1; }
  body.editing #app { justify-content:flex-start; }
  body.editing #edTools { max-height:calc(100vh - 84px); overflow-y:auto; }
  body.editing #edPanel { max-height:calc(100vh - 84px); }
  @media (max-height: 480px){ #edTools button { width:38px; height:38px; font-size:17px; } #edTools { grid-template-columns:repeat(2, 38px) !important; } #edTop { padding:4px 6px; } #edTop button { padding:5px 9px; } }
  #edTools { grid-template-columns:repeat(2, 44px); gap:5px; align-content:start; background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:14px; padding:6px; }
  #edTools button { width:44px; height:44px; padding:0; font-size:20px; border-radius:11px; background:rgba(255,255,255,.08); box-shadow:none; }
  #edTools button:hover { background:rgba(255,255,255,.18); }
  #edTools button.on { background:var(--accent); box-shadow:0 0 0 2px #fff inset; }
  #edPanel { width:260px; max-height:calc(100vh - 90px); overflow:auto; background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:12px; font-size:14px; }
  #edPanel h4 { margin:0 0 8px; font-size:16px; }
  .fld { display:grid; grid-template-columns:62px 1fr 56px; gap:6px; align-items:center; margin:5px 0; }
  .fld2 { display:grid; grid-template-columns:62px 1fr; gap:6px; align-items:center; margin:5px 0; }
  .fld span, .fld2 span { font-size:13px; color:var(--dim); }
  #edPanel input[type=number], #edPanel input[type=text] { font:inherit; font-size:13px; background:rgba(0,0,0,.3); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:4px 6px; width:100%; min-width:0; }
  input[type=range] { accent-color:var(--accent); width:100%; min-width:0; }
  .sub { font-size:12px; color:var(--dim); margin:10px 0 4px; letter-spacing:.5px; }
  .dirs { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
  .dirs button, .chips button { padding:5px 0; font-size:15px; border-radius:8px; background:rgba(255,255,255,.1); color:var(--ink); box-shadow:none; }
  .dirs button.on, .chips button.on { background:var(--accent); color:#2a2100; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; } .chips button { padding:4px 8px; font-size:12px; }
  .pbtns { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .pbtns button { padding:6px 10px; font-size:13px; border-radius:10px; }
  .warn { background:rgba(255,120,80,.15); border:1px solid rgba(255,120,80,.45); border-radius:10px; padding:6px 8px; margin:6px 0; font-size:13px; }
  .keys { font-size:12px; color:var(--dim); line-height:1.7; margin-top:12px; }
  .keys summary { cursor:pointer; color:var(--ink); font-weight:600; }
  .keys kbd { background:rgba(255,255,255,.14); border-radius:5px; padding:0 5px; font-family:inherit; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); background:rgba(10,20,15,.92); color:#fff; padding:10px 16px; border-radius:12px; opacity:0; transition:.25s; pointer-events:none; z-index:20; font-weight:500; border:1px solid var(--line); max-width:90vw; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  /* ---------- Records ---------- */
  .records { background:rgba(0,0,0,.2); border-radius:14px; padding:6px 12px 8px; margin:8px auto; max-width:340px; }
  .records .sub { margin:4px 0; }
  .rec { display:grid; grid-template-columns:26px 1fr auto; gap:6px; align-items:center; padding:3px 6px; border-radius:8px; text-align:left; }
  .rec.me, .lt .me { background:rgba(255,211,78,.18); box-shadow:inset 0 0 0 1px var(--accent); }
  .recmsg { margin-top:6px; color:var(--accent); font-weight:600; }
  .lboard { display:flex; flex-direction:column; gap:6px; max-height:52vh; overflow:auto; margin:10px 0; text-align:left; }
  .lrow { display:grid; grid-template-columns:minmax(140px, 1fr) 2fr; gap:10px; align-items:center; background:rgba(255,255,255,.06); border-radius:12px; padding:8px 12px; }
  .lh b { color:var(--accent); margin-right:4px; } .lh small { color:var(--dim); }
  .lt { display:flex; gap:6px; flex-wrap:wrap; } .lt span { padding:3px 8px; border-radius:8px; background:rgba(0,0,0,.2); font-size:14px; }
  @media (max-width:560px){ .lrow { grid-template-columns:1fr; } }
  /* ---------- Custom maps hub ---------- */
  .card.wide { min-width:min(700px, 94vw); }
  .hubbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin:8px 0; }
  .maplist { display:flex; flex-direction:column; gap:8px; text-align:left; max-height:44vh; overflow:auto; padding:2px; margin-top:4px; }
  .maprow { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.06); border-radius:14px; padding:8px 10px; }
  .mswatch { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:22px; flex:none; box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); }
  .minfo { flex:1; min-width:0; } .minfo b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .minfo small { color:var(--dim); }
  .mbtns { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .mbtns button { padding:7px 10px; font-size:13px; border-radius:10px; }
  .empty { padding:22px 10px; text-align:center; color:var(--ink); background:rgba(255,255,255,.04); border-radius:14px; line-height:1.6; }
  .textin { font:inherit; background:rgba(0,0,0,.3); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .presets { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:4px 0; }
  .preset { padding:16px 4px 6px; border-radius:12px; color:#fff; font-size:12px; box-shadow:0 3px 0 rgba(0,0,0,.3); text-shadow:0 1px 3px #000; }
  .colors { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; text-align:left; max-width:340px; margin:0 auto; }
  .colors label { display:flex; align-items:center; gap:8px; }
  input[type=color] { width:40px; height:32px; border:none; background:none; padding:0; cursor:pointer; }
  .emojis { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; max-width:420px; margin:0 auto; }
  .emojis button { padding:4px 7px; font-size:20px; background:rgba(255,255,255,.08); box-shadow:none; border-radius:9px; }
  .emojis button.on { background:var(--accent); }
  @media (max-width: 760px){
    #stage { flex-direction:column; align-items:center; }
    #edTools { grid-template-columns:none; grid-auto-flow:column; overflow-x:auto; max-width:calc(100vw - 16px); }
    #edPanel { position:fixed; left:8px; right:8px; bottom:8px; width:auto; max-height:36vh; z-index:3; }
    #edName { width:120px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hole-info">
      <span class="hole-num" id="hHole">TINY TEES</span>
      <span class="hole-name" id="hName"></span>
      <span class="par" id="hPar"></span>
    </div>
    <div id="players"></div>
    <div class="right">
      <span class="gems" id="hGems">💎 0</span>
      <button class="ghost icon" id="btnRestart" title="Restart hole" style="display:none">↻</button>
      <button class="ghost icon" id="btnMute" title="Mute (M)">🔊</button>
      <button class="ghost icon" id="btnPause" title="Menu (Esc)">☰</button>
    </div>
  </div>
  <div id="edTop">
    <button class="ghost" data-ed="exit" title="Back to My maps">← Maps</button>
    <button class="ghost icon" data-ed="emoji" id="edEmoji" title="Course icon">⛳</button>
    <input id="edName" maxlength="40" aria-label="Course name">
    <div id="edHoles"></div>
    <button class="ghost" data-ed="theme" title="Colors & theme">🎨 Theme</button>
    <div class="spacer"></div>
    <button class="ghost icon" data-ed="undo" title="Undo (Ctrl+Z)">↶</button>
    <button class="ghost icon" data-ed="redo" title="Redo (Ctrl+Y)">↷</button>
    <button class="ghost" data-ed="snap" id="edSnap" title="Snap to grid (G)">▦ Snap</button>
    <button class="ghost" data-ed="share" title="Share link">🔗 Share</button>
    <button data-ed="test" title="Play this hole (T)">▶ Test</button>
    <span id="edSaved" class="muted"></span>
  </div>
  <div id="stage">
    <div id="edTools"></div>
    <div id="wrap">
      <canvas id="c"></canvas>
      <div id="overlay" class="hidden"></div>
    </div>
    <div id="edPanel"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
"use strict";

// =====================================================================
//  Constants
// =====================================================================
const DT = 1/60;
// The playfield size can change per hole (custom maps). Built-in holes use 720x420.
let W = 800, H = 500;
let MIN_X = 40, MIN_Y = 40, MAX_X = 760, MAX_Y = 460;
const DEFAULT_SIZE = [720, 420], SIZE_MIN = [400, 280], SIZE_MAX = [1200, 760];
function applySize(size){
  const w = size ? size[0] : DEFAULT_SIZE[0], h = size ? size[1] : DEFAULT_SIZE[1];
  if (W === w + 80 && H === h + 80) return;
  W = w + 80; H = h + 80; MAX_X = 40 + w; MAX_Y = 40 + h;
  if (typeof resize === "function") resize();
}
const BALL_R = 7, HOLE_R = 11;
const MAX_DRAG = 160, MAX_SPEED = 17;
const SUBSTEPS = 8, WALL_E = 0.72, BUMPER_KICK = 1.35;
const MAX_STROKES = 10, PREVIEW_FRAMES = 34;
const FONT = 'Fredoka, "Trebuchet MS", system-ui, sans-serif';

const PLAYER_COLORS = ["#ff5d5d", "#4da3ff", "#ffd34e", "#b77dff"];
const PORTAL_COLORS = ["#b77dff", "#ff9f43", "#4dd9a6"];

const SKINS = [
  { id:"classic", name:"Classic", cost:0,  body:"#ffffff", trail:"plain" },
  { id:"sunny",   name:"Sunny",   cost:5,  body:"#ffe14d", trail:"plain" },
  { id:"ocean",   name:"Ocean",   cost:10, body:"#5ec8ff", trail:"bubbles" },
  { id:"ember",   name:"Ember",   cost:20, body:"#ff7a3d", trail:"fire" },
  { id:"galaxy",  name:"Galaxy",  cost:35, body:"#a77bff", trail:"spark" },
  { id:"rainbow", name:"Rainbow", cost:60, body:"rainbow", trail:"rainbow" },
];

// =====================================================================
//  Holes
//  walls / sand / water / ice: [x, y, w, h]     bumpers: [x, y, r]
//  boosts: [x, y, angleDeg]                       gems: [x, y]
//  portals: [x1, y1, x2, y2]  (two-way)
//  slopes: {x, y, r, k}  k > 0 = hill (pushes out), k < 0 = dip (pulls in)
//  movers: {x, y, w, h, ax, ay, speed}           spinners: {x, y, len, speed, blades}
// =====================================================================
const GREEN_LEVELS = [
  { name:"Warm Up", par:2, tee:[130,250], hole:[670,250], gems:[[400,120]],
    tip:"Drag back anywhere, then let go to putt" },
  { name:"Around the Bend", par:2, tee:[130,130], hole:[670,130],
    walls:[[380,40,40,290]], gems:[[400,420]], tip:"Bank it off the rails" },
  { name:"Sand Trap", par:3, tee:[110,400], hole:[690,100],
    walls:[[250,40,24,170],[526,290,24,170]], sand:[[310,170,180,160]], gems:[[400,250]],
    tip:"Sand slows the ball a lot" },
  { name:"Boost Lane", par:3, tee:[110,370], hole:[150,120],
    walls:[[40,190,580,20]], boosts:[[420,380,0],[700,380,-90],[700,120,180]], gems:[[430,75]],

const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n>>16, (n>>8)&255, n&255]; };
const rgbHex = c => "#" + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
const shade = (h, f) => { const c = hexRgb(h); return rgbHex(f >= 0 ? c.map(v => v + (255-v)*f) : c.map(v => v*(1+f))); };
const lum = h => { const [r,g,b] = hexRgb(h); return (0.299*r + 0.587*g + 0.114*b) / 255; };
const isHex = v => typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v);

function buildTheme(c){
  const style = HAZARD_STYLES[c.style] ? c.style : "green";
  const fair = isHex(c.fair) ? c.fair : "#4caf50", rough = isHex(c.rough) ? c.rough : "#1c4a2f";
  const rail = isHex(c.rail) ? c.rail : "#8b5a2b", wall = isHex(c.wall) ? c.wall : "#9a6533";
  return {
    style,
    page:`radial-gradient(ellipse at 50% -10%, ${shade(rough, .12)} 0%, ${shade(rough, -.45)} 45%, ${shade(rough, -.75)} 100%)`,
    rough, roughDot: style === "cosmic" ? "rgba(255,255,255,.6)" : lum(rough) > .5 ? "rgba(0,0,0,.08)" : "rgba(255,255,255,.04)",
    railOuter:shade(rail, -.35), rail,
    fairA:fair, fairB:shade(fair, lum(fair) > .8 ? -.04 : .07), wallA:wall, wallB:shade(wall, -.25),
  };
}

function tone(freq, dur, type="sine", vol=0.2, slideTo=0, delay=0){
  if (save.muted || demo) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch(e) {}
}

function rectSegs(x, y, w, h, vf){
  return [
    { ax:x,   ay:y,   bx:x+w, by:y,   vf }, { ax:x+w, ay:y,   bx:x+w, by:y+h, vf },
    { ax:x+w, ay:y+h, bx:x,   by:y+h, vf }, { ax:x,   ay:y+h, bx:x,   by:y,   vf },
  ];
}
const inRect = (px, py, r) => px >= r[0] && px <= r[0]+r[2] && py >= r[1] && py <= r[1]+r[3];

  (level.breakables || []).forEach((w, k) => rectSegs(w[0], w[1], w[2], w[3], null).forEach(s => { s.brk = k; staticSegs.push(s); }));

function moverState(m){
  const s = Math.sin(t*m.speed), c = Math.cos(t*m.speed) * m.speed * DT;
  return { cx:m.x + m.ax*s, cy:m.y + m.ay*s, vx:m.ax*c, vy:m.ay*c };
}

function updateDynamic(){
  dynSegs = []; dynCircles = [];
  (level.movers || []).forEach(m => {
    const s = moverState(m), vf = () => [s.vx, s.vy];
    dynSegs.push(...rectSegs(s.cx - m.w/2, s.cy - m.h/2, m.w, m.h, vf));
  });
  (level.spinners || []).forEach(sp => {
    const a0 = t*sp.speed, w = sp.speed*DT;
    const vf = (px, py) => [-w*(py-sp.y), w*(px-sp.x)];
    for (let i = 0; i < sp.blades; i++){
      const a = a0 + i*Math.PI*2/sp.blades;
      dynSegs.push({ ax:sp.x, ay:sp.y, bx:sp.x+Math.cos(a)*sp.len, by:sp.y+Math.sin(a)*sp.len, vf });
    }
    dynCircles.push({ x:sp.x, y:sp.y, r:11, kick:false });
  });
}

// =====================================================================
//  Physics (pure on a ball object; fx = event hooks, null for previews)
// =====================================================================
function collideSeg(b, s, fx){
  if (s.brk != null && b.broken.has(s.brk)) return;
  const dx = s.bx-s.ax, dy = s.by-s.ay, len2 = dx*dx + dy*dy;
  let u = ((b.x-s.ax)*dx + (b.y-s.ay)*dy) / len2;
  u = u < 0 ? 0 : u > 1 ? 1 : u;
  const cx = s.ax + u*dx, cy = s.ay + u*dy;
  let nx = b.x-cx, ny = b.y-cy;
  const d = Math.hypot(nx, ny);
  if (d >= b.r || d < 1e-6) return;
  nx /= d; ny /= d;
  const [ovx, ovy] = s.vf ? s.vf(cx, cy) : [0, 0];
  const rv = (b.vx-ovx)*nx + (b.vy-ovy)*ny;
  if (s.brk != null && -rv > BREAK_V){        // smash the crystal and keep going
    b.broken.add(s.brk); b.vx *= 0.7; b.vy *= 0.7;
    if (fx) fx.shatter(s.brk);
    return;
  }
  b.x = cx + nx*b.r; b.y = cy + ny*b.r;
  if (rv < 0){
    b.vx -= (1+WALL_E)*rv*nx; b.vy -= (1+WALL_E)*rv*ny;
    if (fx && -rv > 1) fx.wall(-rv, cx, cy);
  }
}

function collideCircle(b, c, fx){
  let nx = b.x-c.x, ny = b.y-c.y;
  const d = Math.hypot(nx, ny), min = b.r + c.r;
  if (d >= min || d < 1e-6) return;
  nx /= d; ny /= d;
  b.x = c.x + nx*min; b.y = c.y + ny*min;
  const rv = b.vx*nx + b.vy*ny;
  if (rv < 0){
    const e = c.kick ? BUMPER_KICK : WALL_E;
    b.vx -= (1+e)*rv*nx; b.vy -= (1+e)*rv*ny;
    if (fx){ if (c.kick) fx.bump(c); else if (-rv > 1) fx.wall(-rv, b.x, b.y); }
  }
}

function collideAll(b, fx){
  for (const s of staticSegs) collideSeg(b, s, fx);
  for (const s of dynSegs) collideSeg(b, s, fx);
  for (const c of bumperList) collideCircle(b, c, fx);
  for (const c of dynCircles) collideCircle(b, c, fx);
}

// Advances one frame. Returns "sink" | "water" | "stop" | null.
function physicsFrame(b, fx){
  for (let i = 0; i < SUBSTEPS; i++){
    b.x += b.vx/SUBSTEPS; b.y += b.vy/SUBSTEPS;
    collideAll(b, fx);
  }

  // slopes
  let slopeF = 0;
  for (const s of level.slopes || []){
    const dx = b.x-s.x, dy = b.y-s.y, d = Math.hypot(dx, dy);
    if (d < s.r && d > 0.5){
      // hills push hardest at the top; dips pull hardest mid-slope and go flat at the bottom so the ball can settle
      const q = d/s.r, f = s.k > 0 ? s.k*(1 - q) : s.k*Math.min(1, 4*q*(1 - q)*1.3);
      b.vx += dx/d*f; b.vy += dy/d*f;
      slopeF = Math.max(slopeF, Math.abs(f));
    }
  }

  // boost pads: redirect + snap onto the pad's line
  let inBoost = -1;
  (level.boosts || []).forEach((p, i) => {
    if (Math.hypot(b.x-p[0], b.y-p[1]) >= 18) return;
    inBoost = i;
    if (b.boostIn === i) return;
    const a = p[2]*Math.PI/180, ux = Math.cos(a), uy = Math.sin(a);
    const along = (b.x-p[0])*ux + (b.y-p[1])*uy;
    b.x = p[0] + ux*along; b.y = p[1] + uy*along;
    const sp = Math.max(Math.hypot(b.vx, b.vy), 13);
    b.vx = ux*sp; b.vy = uy*sp;
    if (fx) fx.boost(p);
  });
  b.boostIn = inBoost;

  // portals
  if (b.portalLock >= 0){
    const e = portalEnds[b.portalLock];
    if (Math.hypot(b.x-e.x, b.y-e.y) > 22) b.portalLock = -1;
  } else {
    for (let i = 0; i < portalEnds.length; i++){
      const e = portalEnds[i];
      if (Math.hypot(b.x-e.x, b.y-e.y) < 13){
        const o = portalEnds[i^1];
        if (fx) fx.portal(e, o);
        b.x = o.x; b.y = o.y; b.portalLock = i^1;
        break;
      }
    }
  }

  // conveyor belts
  let onBelt = false;
  for (const c of level.conveyors || []){
    if (!inRect(b.x, b.y, c)) continue;
    const a = c[4]*Math.PI/180;
    b.vx += Math.cos(a)*0.22; b.vy += Math.sin(a)*0.22; onBelt = true;
  }

  // surface friction
  const onSand = (level.sand || []).some(r => inRect(b.x, b.y, r));
  const onIce = !onSand && (level.ice || []).some(r => inRect(b.x, b.y, r));
  const f = onSand ? 0.92 : onIce ? 0.996 : 0.983;
  b.vx *= f; b.vy *= f;
  const sp = Math.hypot(b.vx, b.vy);
  if (fx && onSand && sp > 2 && Math.random() < 0.4) fx.sand(b);

  // cup
  const hx = level.hole[0]-b.x, hy = level.hole[1]-b.y, hd = Math.hypot(hx, hy);
  if (hd < HOLE_R + 5 && hd > 0.01){
    const pull = hd < HOLE_R ? 0.55 : 0.12;
    b.vx += hx/hd*pull; b.vy += hy/hd*pull;
    if (hd < HOLE_R - 2 && sp < 7) return "sink";
  }

  if ((level.water || []).some(r => inRect(b.x, b.y, r))) return "water";
  if (b.x < MIN_X-5 || b.x > MAX_X+5 || b.y < MIN_Y-5 || b.y > MAX_Y+5) return "water"; // safety net
  if (Math.hypot(b.vx, b.vy) < 0.06 && slopeF < 0.03 && !onBelt) return "stop";
  return null;
}

const FX = {
  wall(v, x, y){ sfx.wall(v); if (v > 6){ shake = Math.max(shake, 2); ring(x, y, "rgba(255,255,255,", 14); } },
  bump(c){ c.flash = 1; sfx.bump(); shake = Math.max(shake, 5); ring(c.x, c.y, "rgba(255,107,107,", c.r + 22); burst(c.x, c.y, "#ff8a8a", 8, 2.5); },
  boost(p){ sfx.boost(); ring(p[0], p[1], "rgba(255,211,78,", 30); burst(p[0], p[1], "#ffd34e", 10, 3); },
  portal(a, o){ sfx.portal(); const col = PORTAL_COLORS[a.c % PORTAL_COLORS.length];
    burst(a.x, a.y, col, 14, 3); burst(o.x, o.y, col, 14, 3); ring(o.x, o.y, hexToRgba(col), 30); },
  sand(b){ burst(b.x, b.y, "#d9bd7a", 1, 1); },
  shatter(k){
    const r = level.breakables[k], cx = r[0]+r[2]/2, cy = r[1]+r[3]/2;
    sfx.shatter(); shake = Math.max(shake, 6);
    for (let i = 0; i < 26; i++){
      particles.push({ x:r[0]+Math.random()*r[2], y:r[1]+Math.random()*r[3], vx:(Math.random()-.5)*5, vy:(Math.random()-.5)*5,
        g:0, life:1, decay:0.02+Math.random()*0.02, color:Math.random() < .5 ? "#7df9ff" : "#ff7df0", size:2+Math.random()*3, square:true, rot:Math.random()*6 });
    }
    ring(cx, cy, "rgba(125,249,255,", 40);
  },
};
function hexToRgba(h){ const n = parseInt(h.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},`; }

// =====================================================================
//  Game loop step
// =====================================================================
function step(){
  t += DT;
  updateDynamic();
  bumperList.forEach(b => b.flash = Math.max(0, b.flash - 0.06));
  shake *= 0.85;

  if (state === "aim"){
    collideAll(ball, FX);           // moving obstacles can nudge a resting ball
    if (Math.hypot(ball.vx, ball.vy) > 0.3){ state = "rolling"; drag = null; rollFrames = 0; }
    else { ball.vx = ball.vy = 0; }
    if (demo && (demoTimer -= DT) <= 0) demoShot();
  }

  if (state === "rolling"){
    rollFrames++;
    const res = physicsFrame(ball, FX);
    emitTrail();
    checkGems();
    if (res === "sink") startSink();
    else if (res === "water") splash();
    else if (res === "stop" || (rollFrames > 900 && Math.hypot(ball.vx, ball.vy) < 2.5)){
      ball.vx = ball.vy = 0;
      if (demo){ if (strokes >= 4) nextDemo(); else { state = "aim"; demoTimer = 0.9; } }
      else if (strokes >= MAX_STROKES) endTurn(true);
      else state = "aim";
    }
  }

  if (state === "sinking"){
    sinkTimer -= DT;
    ball.x += (level.hole[0]-ball.x)*0.25; ball.y += (level.hole[1]-ball.y)*0.25;
    ball.r = Math.max(0, BALL_R * (sinkTimer/0.35));
    if (sinkTimer <= 0){ ball.r = 0; demo ? nextDemo() : endTurn(false); }
  }

  trail.forEach(p => p.life -= 0.045); trail = trail.filter(p => p.life > 0);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.97; p.life -= p.decay; });
  particles = particles.filter(p => p.life > 0);
  rings.forEach(r => r.life -= 0.04); rings = rings.filter(r => r.life > 0);
  floaters.forEach(f => { f.life -= DT; f.y -= f.rise || 0; }); floaters = floaters.filter(f => f.life > 0);
  if (banner) { banner.life -= DT; if (banner.life <= 0) banner = null; }
}

function shoot(power, ux, uy){
  lastPos = { x:ball.x, y:ball.y };
  ball.vx = ux * power * MAX_SPEED; ball.vy = uy * power * MAX_SPEED;
  strokes++; state = "rolling"; rollFrames = 0;
  sfx.hit(power);
  burst(ball.x, ball.y, "rgba(255,255,255,.8)", 6, 1.5);
  updateHUD();
}

function splash(){
  sfx.splash();
  burst(ball.x, ball.y, "#8fd3ff", 22, 3.5);
  ring(ball.x, ball.y, "rgba(143,211,255,", 30);
  if (!demo){
    strokes++;
    floaters.push({ x:ball.x, y:ball.y-16, text:"Splash! +1", life:1.4, max:1.4, size:22, color:"#8fd3ff", rise:0.6 });
  }
  const broken = ball.broken;
  ball = makeBall(lastPos.x, lastPos.y);
  ball.broken = broken;
  updateHUD();
  if (!demo && strokes >= MAX_STROKES) endTurn(true);
  else { state = "aim"; demoTimer = 0.9; }
}

function startSink(){
  state = "sinking"; sinkTimer = 0.35; ball.vx = ball.vy = 0;
  ring(level.hole[0], level.hole[1], "rgba(255,211,78,", 40);
}

function checkGems(){
  if (demo) return;
  (level.gems || []).forEach((g, i) => {
    if (turnGems.has(i) || Math.hypot(ball.x-g[0], ball.y-g[1]) > 15) return;
    turnGems.add(i);
    const real = worldIdx < BUILTIN;
    if (real){ save.gems++; persist(); }
    sfx.gem();
    burst(g[0], g[1], "#7fe0ff", 16, 3);
    ring(g[0], g[1], "rgba(127,224,255,", 26);
    floaters.push({ x:g[0], y:g[1]-16, text:real ? "+1 💎" : "✨", life:1.1, max:1.1, size:20, color:"#7fe0ff", rise:0.7 });
    const el = $("hGems"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    updateHUD();
  });
}

// =====================================================================
//  Round / turn flow
// =====================================================================
function scoreName(s, p){
  if (s === 1) return "HOLE IN ONE!";
  const d = s - p;
  const names = { "-3":"Albatross!", "-2":"Eagle!", "-1":"Birdie!", "0":"Par", "1":"Bogey", "2":"Double Bogey", "3":"Triple Bogey" };
  return names[d] || (d < 0 ? "Incredible!" : `+${d}`);
}

function startRound(world, holes, nPlayers, practice, course, extra = {}){
  demo = false; token++;
  setWorld(world);
  round = {
    ...extra, world, holes, hi:0, pi:0, practice, course,
    players: Array.from({ length:nPlayers }, (_, i) => ({ name:nPlayers === 1 ? "You" : `P${i+1}`, color:PLAYER_COLORS[i], scores:[] })),
  };
  hideOverlay();
  startTurn(true);
  if (round.pubId) loadRoundRecords();
}

function startTurn(newHole){
  if (newHole) loadLevel(round.holes[round.hi]); else { resetBall(); trail = []; }
  const p = curPlayer();
  const holeLabel = round.test ? `Test · Hole ${levelIdx+1}` : round.practice ? `Practice · Hole ${levelIdx+1}` : `Hole ${round.hi+1} of ${round.holes.length}`;
  banner = { title:level.name, sub:`${holeLabel} · Par ${level.par}` + (round.players.length > 1 ? ` · ${p.name}'s turn` : ""), life:2.2, max:2.2, color:p.color };
  if (level.tip && newHole) floaters.push({ x:W/2, y:H-20, text:level.tip, life:4.5, max:4.5, size:16, color:"#fff" });
  state = "aim";
  updateHUD();
  if (round.pubId) announceRecord();
}

function endTurn(maxed){
  state = "done";
  const p = curPlayer();
  p.scores[round.hi] = strokes;
  // per-hole best
  const hk = holeKey(worldIdx, levelIdx), prev = save.holeBest[hk];
  if (prev == null || strokes < prev){ save.holeBest[hk] = strokes; persist(); }
  const name = maxed ? "Max strokes" : scoreName(strokes, level.par);
  if (!maxed){
    strokes === 1 ? sfx.ace() : sfx.sink();
    confetti(level.hole[0], level.hole[1], strokes === 1 ? 120 : strokes <= level.par ? 60 : 20);
    if (strokes === 1) shake = 8;
  }
  floaters.push({ x:W/2, y:H/2, text:name, life:1.6, max:1.6, size:52, color:strokes <= level.par && !maxed ? "#ffd34e" : "#ffffff", rise:0.3 });
  round.placeMsg = "";
  if (round.pubId && !maxed) recordScore();
  updateHUD();
  const my = ++token;
  setTimeout(() => {
    if (my !== token) return;
    if (round.pi < round.players.length - 1){ round.pi++; startTurn(false); }
    else showHoleCard();
  }, 1500);
}

function nextHole(){
  round.hi++; round.pi = 0;
  hideOverlay();
  startTurn(true);
}

// ---------- Demo / attract mode behind the menu ----------
function startDemo(){
  demo = true; round = null; token++;
  nextDemo();
}
function nextDemo(){
  const open = WORLDS.slice(0, BUILTIN).map((w, i) => i).filter(i => save.unlocked.includes(WORLDS[i].id));
  const w = overlay.dataset.world != null && open.includes(+overlay.dataset.world) ? +overlay.dataset.world : open[Math.floor(Math.random()*open.length)];
  setWorld(w);
  loadLevel(Math.floor(Math.random()*LEVELS.length));
  state = "aim"; demoTimer = 1.0;
  updateHUD();
}
function demoShot(){
  const dx = level.hole[0]-ball.x, dy = level.hole[1]-ball.y, d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx) + (Math.random()-0.5)*0.5;
  shoot(Math.min(1, d/560 + 0.2 + Math.random()*0.2), Math.cos(a), Math.sin(a));
}

// =====================================================================
//  Effects
// =====================================================================
function burst(x, y, color, n, spd){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, s = Math.random()*spd;
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, g:0.04, life:1, decay:0.03+Math.random()*0.03, color, size:1.5+Math.random()*2.5 });
  }
}
function confetti(x, y, n){
  const cols = ["#ffd34e","#ff6b6b","#6bd1ff","#9cff6b","#ff9cf0","#ffffff"];
  for (let i = 0; i < n; i++){
    const a = -Math.PI/2 + (Math.random()-0.5)*2.4, s = 3 + Math.random()*6;
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, g:0.15, life:1, decay:0.007+Math.random()*0.01,
      color:cols[i % cols.length], size:3+Math.random()*3, square:true, rot:Math.random()*6 });
  }
}
function ring(x, y, rgbaPrefix, maxR){ rings.push({ x, y, c:rgbaPrefix, maxR, life:1 }); }

function emitTrail(){
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp < 1.2) return;
  const s = skin();
  switch (s.trail){
    case "rainbow": trail.push({ x:ball.x, y:ball.y, life:1, c:`hsla(${(t*360)%360},95%,62%,` }); break;
    case "bubbles":
      trail.push({ x:ball.x, y:ball.y, life:1, c:"rgba(140,220,255," });
      if (Math.random() < 0.25) particles.push({ x:ball.x, y:ball.y, vx:(Math.random()-.5), vy:-0.4, g:-0.01, life:1, decay:0.025, color:"rgba(200,240,255,.8)", size:2+Math.random()*2, hollow:true });
      break;
    case "fire":
      for (let i = 0; i < 2; i++) particles.push({ x:ball.x+(Math.random()-.5)*6, y:ball.y+(Math.random()-.5)*6, vx:(Math.random()-.5)*0.6, vy:-0.3-Math.random()*0.6, g:-0.02, life:1, decay:0.05, color:Math.random() < .5 ? "#ffb347" : "#ff5d2a", size:2+Math.random()*3 });
      break;
    case "spark":
      trail.push({ x:ball.x, y:ball.y, life:1, c:"rgba(183,125,255," });
      if (Math.random() < 0.5) particles.push({ x:ball.x+(Math.random()-.5)*10, y:ball.y+(Math.random()-.5)*10, vx:0, vy:0, g:0, life:1, decay:0.04, color:Math.random() < .5 ? "#ffffff" : "#d9c2ff", size:1.5+Math.random()*1.5, star:true });
      break;
    default: trail.push({ x:ball.x, y:ball.y, life:1, c:"rgba(255,255,255," });
  }
}

// =====================================================================
//  Rendering
// =====================================================================
function hash(n){ const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
function circle(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); }

function drawWallRect(x, y, w, h, hazard){
  ctx.fillStyle = "rgba(0,0,0,.25)"; rr(x+4, y+5, w, h, 5); ctx.fill();
  if (hazard){
    ctx.fillStyle = "#e0b030"; rr(x, y, w, h, 5); ctx.fill();
    ctx.save(); rr(x, y, w, h, 5); ctx.clip();
    ctx.fillStyle = "#2b2b2b";
    for (let i = -h; i < w+h; i += 14){ ctx.beginPath(); ctx.moveTo(x+i, y); ctx.lineTo(x+i+7, y); ctx.lineTo(x+i+7-h, y+h); ctx.lineTo(x+i-h, y+h); ctx.fill(); }
    ctx.restore();
  } else {
    const T = theme(), g = ctx.createLinearGradient(x, y, x+w, y+h);
    g.addColorStop(0, T.wallA); g.addColorStop(1, T.wallB);
    ctx.fillStyle = g; rr(x, y, w, h, 5); ctx.fill();
    if (theme().style === "cosmic"){
      ctx.save(); ctx.shadowColor = "#ff3cac"; ctx.shadowBlur = 10;
      ctx.strokeStyle = "#ff3cac"; ctx.lineWidth = 2; rr(x+1, y+1, w-2, h-2, 5); ctx.stroke(); ctx.restore();
    } else {
      ctx.fillStyle = "rgba(255,255,255,.14)"; rr(x+2, y+2, w-4, Math.min(5, h-4), 3); ctx.fill();
      if (theme().style === "desert"){   // rock strata
        ctx.strokeStyle = "rgba(80,30,10,.35)"; ctx.lineWidth = 1.5;
        if (h > w) for (let yy = y + 14; yy < y + h - 4; yy += 16){ ctx.beginPath(); ctx.moveTo(x+3, yy); ctx.lineTo(x+w-3, yy+3); ctx.stroke(); }
        else for (let xx = x + 14; xx < x + w - 4; xx += 16){ ctx.beginPath(); ctx.moveTo(xx, y+3); ctx.lineTo(xx+3, y+h-3); ctx.stroke(); }
      }
    }
  }
}

function drawCrystal(r){
  const [x, y, w, h] = r;
  ctx.save(); ctx.shadowColor = "#7df9ff"; ctx.shadowBlur = 12 + Math.sin(t*3)*4;
  const g = ctx.createLinearGradient(x, y, x+w, y+h);
  g.addColorStop(0, "rgba(125,249,255,.85)"); g.addColorStop(1, "rgba(255,125,240,.75)");
  ctx.fillStyle = g; rr(x, y, w, h, 4); ctx.fill(); ctx.restore();
  ctx.save(); rr(x, y, w, h, 4); ctx.clip();
  ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1.2;
  for (let i = 0; i < 6; i++){ const yy = y + hash(i + x)*h; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x+w, yy + (hash(i+y)-.5)*30); ctx.stroke(); }
  const sh = ((t*0.5 + x*0.01) % 1.5) * (h + 40) - 20;
  ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.fillRect(x, y + sh, w, 8);
  ctx.restore();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; rr(x, y, w, h, 4); ctx.stroke();
}

function drawBumper(b){
  const th = theme().style, r = b.r * (1 + b.flash*0.2), lit = b.flash > 0.1;
  ctx.fillStyle = "rgba(0,0,0,.25)"; circle(b.x+3, b.y+4, b.r); ctx.fill();
  if (th === "desert"){            // top-down cactus
    ctx.fillStyle = lit ? "#b8f27a" : "#3f8f3a"; circle(b.x, b.y, r); ctx.fill();
    ctx.strokeStyle = "rgba(20,60,20,.6)"; ctx.lineWidth = 2;
    for (let k = 0; k < 6; k++){ const a = k*Math.PI/3; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+Math.cos(a)*r*0.9, b.y+Math.sin(a)*r*0.9); ctx.stroke(); }
    ctx.strokeStyle = "#f4e7c5"; ctx.lineWidth = 1.2;
    for (let k = 0; k < 12; k++){ const a = k*Math.PI/6 + 0.26; ctx.beginPath(); ctx.moveTo(b.x+Math.cos(a)*r, b.y+Math.sin(a)*r); ctx.lineTo(b.x+Math.cos(a)*(r+4), b.y+Math.sin(a)*(r+4)); ctx.stroke(); }
    ctx.fillStyle = "#ff6fa8"; circle(b.x, b.y, r*0.25); ctx.fill();
  } else if (th === "cosmic"){     // neon ring
    ctx.save(); ctx.shadowColor = "#ffd34e"; ctx.shadowBlur = lit ? 26 : 12;
    ctx.fillStyle = "#1a1036"; circle(b.x, b.y, r); ctx.fill();
    ctx.strokeStyle = lit ? "#fff" : "#ffd34e"; ctx.lineWidth = 3; circle(b.x, b.y, r-1.5); ctx.stroke();
    ctx.strokeStyle = "#ff3cac"; ctx.lineWidth = 2; circle(b.x, b.y, r*0.5); ctx.stroke();
    ctx.restore();
  } else {
    ctx.fillStyle = lit ? "#fff3a0" : "#e84545"; circle(b.x, b.y, r); ctx.fill();
    ctx.fillStyle = "#fff"; circle(b.x, b.y, r*0.64); ctx.fill();
    ctx.fillStyle = lit ? "#ffb703" : "#e84545"; circle(b.x, b.y, r*0.34); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.45)"; circle(b.x-r*0.35, b.y-r*0.4, r*0.18); ctx.fill();
  }
}

function drawCourse(){
  const T = theme(), th = T.style;

  // rough / backdrop
  ctx.fillStyle = T.rough; ctx.fillRect(-20, -20, W+40, H+40);
  for (let i = 0; i < 70; i++){
    const tw = th === "cosmic" ? 0.3 + 0.7*Math.abs(Math.sin(t*1.5 + i)) : 1;
    ctx.globalAlpha = tw; ctx.fillStyle = T.roughDot;
    circle(hash(i)*W, hash(i+50)*H, th === "cosmic" ? 0.6 + hash(i+9)*1.4 : 2 + hash(i+9)*3); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // rail
  ctx.fillStyle = T.railOuter; rr(MIN_X-17, MIN_Y-17, MAX_X-MIN_X+34, MAX_Y-MIN_Y+34, 16); ctx.fill();
  if (th === "cosmic"){
    ctx.save(); ctx.shadowColor = T.rail; ctx.shadowBlur = 18;
    ctx.strokeStyle = T.rail; ctx.lineWidth = 4; rr(MIN_X-9, MIN_Y-9, MAX_X-MIN_X+18, MAX_Y-MIN_Y+18, 10); ctx.stroke();
    ctx.restore();
  } else {
    ctx.fillStyle = T.rail; rr(MIN_X-13, MIN_Y-13, MAX_X-MIN_X+26, MAX_Y-MIN_Y+26, 12); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.12)"; rr(MIN_X-13, MIN_Y-13, MAX_X-MIN_X+26, 4, 2); ctx.fill();
  }

  // fairway: checkerboard mowing pattern
  for (let x = MIN_X, i = 0; x < MAX_X; x += 40, i++){
    for (let y = MIN_Y, j = 0; y < MAX_Y; y += 40, j++){
      ctx.fillStyle = (i+j) % 2 ? T.fairA : T.fairB;
      ctx.fillRect(x, y, Math.min(40, MAX_X-x), Math.min(40, MAX_Y-y));
    }
  }
  if (th === "cosmic"){
    ctx.strokeStyle = "rgba(45,226,230,.08)"; ctx.lineWidth = 1;
    for (let x = MIN_X; x <= MAX_X; x += 40){ ctx.beginPath(); ctx.moveTo(x, MIN_Y); ctx.lineTo(x, MAX_Y); ctx.stroke(); }
    for (let y = MIN_Y; y <= MAX_Y; y += 40){ ctx.beginPath(); ctx.moveTo(MIN_X, y); ctx.lineTo(MAX_X, y); ctx.stroke(); }
  }
  if (th === "desert"){
    ctx.fillStyle = "rgba(90,60,20,.12)";
    for (let i = 0; i < 40; i++) circle(MIN_X + hash(i+200)*(MAX_X-MIN_X), MIN_Y + hash(i+300)*(MAX_Y-MIN_Y), 1.5 + hash(i)*2), ctx.fill();
  }
  const g = ctx.createLinearGradient(0, MIN_Y, 0, MIN_Y+16);
  g.addColorStop(0, "rgba(0,0,0,.28)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(MIN_X, MIN_Y, MAX_X-MIN_X, 16);

  // slopes (hills/dips · mesas · gravity wells/repulsors)
  (level.slopes || []).forEach(s => {
    const hill = s.k > 0;
    const inner = th === "cosmic" ? (hill ? "rgba(45,226,230,.32)" : "rgba(170,90,255,.5)")
                : th === "desert" ? (hill ? "rgba(200,110,60,.55)" : "rgba(60,30,10,.35)")
                : (hill ? "rgba(220,255,200,.35)" : "rgba(0,40,10,.38)");
    const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
    gr.addColorStop(0, inner);
    gr.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gr; circle(s.x, s.y, s.r); ctx.fill();
    if (th === "cosmic" && !hill){
      // swirling spiral arms
      ctx.strokeStyle = "rgba(200,150,255,.35)"; ctx.lineWidth = 2;
      for (let arm = 0; arm < 3; arm++){
        ctx.beginPath();
        for (let k = 0; k <= 30; k++){
          const f = k/30, a = arm*Math.PI*2/3 - t*1.2 + f*4, d = s.r*(0.95 - f*0.85);
          const px = s.x + Math.cos(a)*d, py = s.y + Math.sin(a)*d;
          k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.stroke();
      }
    }
    ctx.strokeStyle = th === "cosmic" ? (hill ? "rgba(45,226,230,.3)" : "rgba(200,150,255,.25)")
                    : hill ? "rgba(255,255,255,.18)" : "rgba(0,0,0,.18)";
    ctx.lineWidth = 1.5;
    for (let k = 1; k <= 3; k++){ circle(s.x, s.y, s.r*k/3.4); ctx.stroke(); }
    // little flow arrows
    ctx.fillStyle = th === "cosmic" ? "rgba(255,255,255,.4)" : hill ? "rgba(255,255,255,.35)" : "rgba(0,0,0,.3)";
    for (let k = 0; k < 8; k++){
      const a = k*Math.PI/4 + 0.3, ph = ((t*0.4 + k*0.13) % 1);
      const d = hill ? s.r*(0.35 + ph*0.5) : s.r*(0.85 - ph*0.5);
      const px = s.x + Math.cos(a)*d, py = s.y + Math.sin(a)*d, dir = hill ? a : a + Math.PI;
      ctx.save(); ctx.translate(px, py); ctx.rotate(dir);
      ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-3, -4); ctx.lineTo(-3, 4); ctx.fill(); ctx.restore();
    }
  });

  // ice
  (level.ice || []).forEach(r => {
    ctx.fillStyle = "#c8eef7"; rr(r[0], r[1], r[2], r[3], 18); ctx.fill();
    ctx.save(); rr(r[0], r[1], r[2], r[3], 18); ctx.clip();
    ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 3;
    for (let i = 0; i < 9; i++){
      const x = r[0] + hash(i+3)*r[2], y = r[1] + hash(i+31)*r[3], l = 20 + hash(i+7)*40;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+l, y-l*0.6); ctx.stroke();
    }
    const sh = ((t*0.25) % 1.6) - 0.3;
    const lg = ctx.createLinearGradient(r[0]+sh*r[2]-60, 0, r[0]+sh*r[2]+60, 0);
    lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(.5, "rgba(255,255,255,.35)"); lg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = lg; ctx.fillRect(r[0], r[1], r[2], r[3]);
    ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 2; rr(r[0], r[1], r[2], r[3], 18); ctx.stroke();
  });

  // sand
  (level.sand || []).forEach((r, k) => {
    ctx.fillStyle = "#c9ad6c"; rr(r[0]-2, r[1]-2, r[2]+4, r[3]+4, 24); ctx.fill();
    ctx.fillStyle = "#ead39c"; rr(r[0], r[1], r[2], r[3], 22); ctx.fill();
    ctx.fillStyle = "#d4b874";
    for (let i = 0; i < r[2]*r[3]/200; i++){
      ctx.fillRect(r[0]+8+hash(i+k*999)*(r[2]-16), r[1]+8+hash(i*3.7+k*99)*(r[3]-16), 2, 2);
    }
  });

  // conveyor belts
  (level.conveyors || []).forEach(c => {
    const [x, y, w, h, ang] = c, a = ang*Math.PI/180;
    ctx.fillStyle = "rgba(0,0,0,.25)"; rr(x+3, y+4, w, h, 8); ctx.fill();
    ctx.fillStyle = "#3b3f47"; rr(x, y, w, h, 8); ctx.fill();
    ctx.save(); rr(x+4, y+4, w-8, h-8, 5); ctx.clip();
    ctx.fillStyle = "#4a4f59"; ctx.fillRect(x, y, w, h);
    // moving chevrons along the belt direction
    const cx = x + w/2, cy = y + h/2, span = Math.hypot(w, h);
    ctx.translate(cx, cy); ctx.rotate(a);
    ctx.strokeStyle = "rgba(255,190,80,.75)"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round";
    const off = (t*40) % 26;
    for (let s = -span/2 - 26; s < span/2 + 26; s += 26){
      for (let q = -span/2; q < span/2; q += 30){
        ctx.beginPath(); ctx.moveTo(s+off-6, q-7); ctx.lineTo(s+off+2, q); ctx.lineTo(s+off-6, q+7); ctx.stroke();
      }
    }
    ctx.restore();
    ctx.strokeStyle = "#ffb84d"; ctx.lineWidth = 2; rr(x, y, w, h, 8); ctx.stroke();
  });

  // water / quicksand / the void
  if (th === "desert") (level.water || []).forEach((r, k) => {
    ctx.fillStyle = "#6b4a22"; rr(r[0]-2, r[1]-2, r[2]+4, r[3]+4, 16); ctx.fill();
    ctx.fillStyle = "#9c7440"; rr(r[0], r[1], r[2], r[3], 14); ctx.fill();
    ctx.save(); rr(r[0], r[1], r[2], r[3], 14); ctx.clip();
    const cx = r[0]+r[2]/2, cy = r[1]+r[3]/2;
    ctx.strokeStyle = "rgba(60,35,10,.4)"; ctx.lineWidth = 3;
    for (let i = 1; i < 6; i++){ ctx.beginPath(); ctx.ellipse(cx, cy, i*r[2]/9, i*r[3]/9, t*0.4*(i % 2 ? 1 : -1), 0, Math.PI*1.4); ctx.stroke(); }
    ctx.fillStyle = "rgba(255,230,180,.25)";
    for (let i = 0; i < 12; i++) circle(r[0]+hash(i+k*7)*r[2], r[1]+hash(i*2+k)*r[3], 1.5), ctx.fill();
    ctx.restore();
  });
  if (th === "cosmic") (level.water || []).forEach(r => {
    const cx = r[0]+r[2]/2, cy = r[1]+r[3]/2, R = Math.max(r[2], r[3])*0.75;
    const vg = ctx.createRadialGradient(cx, cy, 2, cx, cy, R);
    vg.addColorStop(0, "#000"); vg.addColorStop(0.6, "#05010f"); vg.addColorStop(1, "#160a2e");
    ctx.save(); ctx.shadowColor = "#b77dff"; ctx.shadowBlur = 16;
    ctx.fillStyle = vg; rr(r[0], r[1], r[2], r[3], Math.min(r[2], r[3])/2.2); ctx.fill(); ctx.restore();
    ctx.save(); rr(r[0], r[1], r[2], r[3], Math.min(r[2], r[3])/2.2); ctx.clip();
    for (let i = 0; i < 14; i++){
      const a = hash(i)*6.28 + t*(0.6 + hash(i+3)), d = ((hash(i+5) - t*0.15) % 1 + 1) % 1 * R;
      ctx.fillStyle = `rgba(200,160,255,${d/R})`; circle(cx + Math.cos(a)*d, cy + Math.sin(a)*d, 1.4); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(183,125,255,.7)"; ctx.lineWidth = 2; rr(r[0], r[1], r[2], r[3], Math.min(r[2], r[3])/2.2); ctx.stroke();
  });
  if (th === "lava") (level.water || []).forEach((r, k) => {
    ctx.save(); ctx.shadowColor = "#ff5a1f"; ctx.shadowBlur = 18;
    ctx.fillStyle = "#7a1d06"; rr(r[0]-2, r[1]-2, r[2]+4, r[3]+4, 14); ctx.fill(); ctx.restore();
    const lg = ctx.createLinearGradient(r[0], r[1], r[0]+r[2], r[1]+r[3]);
    lg.addColorStop(0, "#ff7a1a"); lg.addColorStop(.5, "#ff3d00"); lg.addColorStop(1, "#ffb21a");
    ctx.fillStyle = lg; rr(r[0], r[1], r[2], r[3], 12); ctx.fill();
    ctx.save(); rr(r[0], r[1], r[2], r[3], 12); ctx.clip();
    ctx.fillStyle = "rgba(80,15,0,.45)";
    for (let i = 0; i < 8; i++){
      const x = r[0] + ((hash(i+k*5)*r[2] + t*8*(i%2 ? 1 : -1)) % r[2] + r[2]) % r[2], y = r[1] + hash(i*3+k)*r[3];
      ctx.beginPath(); ctx.ellipse(x, y, 10 + hash(i)*14, 5 + hash(i+1)*6, hash(i+2)*3, 0, Math.PI*2); ctx.fill();
    }
    for (let i = 0; i < 5; i++){
      const ph = (t*0.7 + hash(i+k)) % 1;
      ctx.fillStyle = `rgba(255,230,120,${1-ph})`;
      circle(r[0] + hash(i*7+k)*r[2], r[1] + hash(i*11+k)*r[3], 2 + ph*5); ctx.fill();
    }
    ctx.restore();
  });
  if (th === "green") (level.water || []).forEach(r => {
    ctx.fillStyle = "#1f6aa8"; rr(r[0]-2, r[1]-2, r[2]+4, r[3]+4, 12); ctx.fill();
    const wg = ctx.createLinearGradient(0, r[1], 0, r[1]+r[3]);
    wg.addColorStop(0, "#3d9be0"); wg.addColorStop(1, "#2b7cc2");
    ctx.fillStyle = wg; rr(r[0], r[1], r[2], r[3], 10); ctx.fill();
    ctx.save(); rr(r[0], r[1], r[2], r[3], 10); ctx.clip();
    ctx.strokeStyle = "rgba(255,255,255,.32)"; ctx.lineWidth = 2;
    for (let y = r[1]+12; y < r[1]+r[3]; y += 18){
      ctx.beginPath();
      for (let x = r[0]; x <= r[0]+r[2]; x += 6){
        const yy = y + Math.sin(x*0.08 + t*2 + y)*3;
        x === r[0] ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  });

  // boost pads
  (level.boosts || []).forEach(p => {
    ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(p[2]*Math.PI/180);
    ctx.fillStyle = "rgba(0,0,0,.25)"; rr(-20, -13, 44, 30, 7); ctx.fill();
    ctx.fillStyle = "#2b2f3a"; rr(-22, -15, 44, 30, 7); ctx.fill();
    ctx.strokeStyle = "#ffd34e"; ctx.lineWidth = 2; rr(-22, -15, 44, 30, 7); ctx.stroke();
    ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let i = 0; i < 3; i++){
      const a = 0.25 + 0.75 * Math.max(0, Math.sin(t*8 - i*1.1));
      ctx.strokeStyle = `rgba(255,211,78,${a})`;
      const x = -11 + i*10;
      ctx.beginPath(); ctx.moveTo(x-4, -8); ctx.lineTo(x+4, 0); ctx.lineTo(x-4, 8); ctx.stroke();
    }
    ctx.restore();
  });

  // portals
  portalEnds.forEach((e, i) => {
    const col = PORTAL_COLORS[e.c % PORTAL_COLORS.length];
    const gl = ctx.createRadialGradient(e.x, e.y, 2, e.x, e.y, 26);
    gl.addColorStop(0, hexToRgba(col) + ".55)"); gl.addColorStop(1, hexToRgba(col) + "0)");
    ctx.fillStyle = gl; circle(e.x, e.y, 26); ctx.fill();
    ctx.fillStyle = "#1a1030"; circle(e.x, e.y, 15); ctx.fill();
    ctx.lineWidth = 3; ctx.lineCap = "round";
    for (let k = 0; k < 3; k++){
      const a = t*(i % 2 ? -3 : 3) + k*Math.PI*2/3;
      ctx.strokeStyle = k === 0 ? "#fff" : col;
      ctx.beginPath(); ctx.arc(e.x, e.y, 15 - k*4, a, a + Math.PI*1.1); ctx.stroke();
    }
  });

  // tee pad
  ctx.fillStyle = "rgba(255,255,255,.16)"; rr(level.tee[0]-15, level.tee[1]-15, 30, 30, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 1.5; rr(level.tee[0]-15, level.tee[1]-15, 30, 30, 7); ctx.stroke();

  // cup
  const [hx, hy] = level.hole;
  ctx.fillStyle = "rgba(0,0,0,.16)"; circle(hx, hy, HOLE_R+6); ctx.fill();
  ctx.fillStyle = "#0e0e0e"; circle(hx, hy, HOLE_R); ctx.fill();
  ctx.fillStyle = "#2c2c2c"; ctx.beginPath(); ctx.arc(hx, hy+2, HOLE_R-3, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.5; circle(hx, hy, HOLE_R); ctx.stroke();

  // walls & movers
  (level.walls || []).forEach(w => drawWallRect(w[0], w[1], w[2], w[3], false));
  (level.movers || []).forEach(m => { const s = moverState(m); drawWallRect(s.cx-m.w/2, s.cy-m.h/2, m.w, m.h, true); });
  (level.breakables || []).forEach((r, k) => { if (!ball.broken.has(k)) drawCrystal(r); });

  // bumpers
  bumperList.forEach(drawBumper);

  // spinners
  (level.spinners || []).forEach(sp => {
    ctx.lineCap = "round";
    for (let i = 0; i < sp.blades; i++){
      const a = t*sp.speed + i*Math.PI*2/sp.blades;
      const ex = sp.x + Math.cos(a)*sp.len, ey = sp.y + Math.sin(a)*sp.len;
      ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(sp.x+3, sp.y+4); ctx.lineTo(ex+3, ey+4); ctx.stroke();
      ctx.strokeStyle = i % 2 ? "#f2f2f2" : "#d94b4b"; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(sp.x, sp.y); ctx.lineTo(ex, ey); ctx.stroke();
    }
    ctx.fillStyle = "#5c3a1c"; circle(sp.x, sp.y, 12); ctx.fill();
    ctx.fillStyle = "#ffd34e"; circle(sp.x, sp.y, 5); ctx.fill();
  });

  // gems
  (level.gems || []).forEach((g, i) => {
    if (!demo && turnGems.has(i)) return;
    const y = g[1] + Math.sin(t*3 + i)*2.5;
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(g[0]+2, g[1]+10, 6, 2.5, 0, 0, Math.PI*2); ctx.fill();
    const gg = ctx.createLinearGradient(g[0]-7, y-9, g[0]+7, y+9);
    gg.addColorStop(0, "#d8fbff"); gg.addColorStop(1, "#2fa8ff");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.moveTo(g[0], y-10); ctx.lineTo(g[0]+8, y-2); ctx.lineTo(g[0], y+9); ctx.lineTo(g[0]-8, y-2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 1.5; ctx.stroke();
    const tw = Math.max(0, Math.sin(t*4 + i*2));
    ctx.fillStyle = `rgba(255,255,255,${tw})`;
    star(g[0]+7, y-9, 3*tw + 0.5);
  });
}

function star(x, y, r){
  ctx.beginPath();
  for (let i = 0; i < 8; i++){ const a = i*Math.PI/4, rr2 = i % 2 ? r*0.35 : r; ctx.lineTo(x+Math.cos(a)*rr2, y+Math.sin(a)*rr2); }
  ctx.closePath(); ctx.fill();
}

function drawAim(){
  if (!drag || state !== "aim" || demo) return;
  const dx = drag.sx - drag.x, dy = drag.sy - drag.y, d = Math.hypot(dx, dy);
  if (d < 6) return;
  const p = Math.min(d, MAX_DRAG) / MAX_DRAG, ux = dx/d, uy = dy/d;
  const col = `hsl(${120 - p*120}, 90%, 58%)`;

  // predicted path (first part only — skill still matters!)
  const ghost = { ...ball, broken:new Set(ball.broken), vx:ux*p*MAX_SPEED, vy:uy*p*MAX_SPEED };
  for (let i = 1; i <= PREVIEW_FRAMES; i++){
    const res = physicsFrame(ghost, null);
    if (i % 2 === 0){
      const a = 1 - i/PREVIEW_FRAMES;
      ctx.fillStyle = `rgba(255,255,255,${a*0.85})`;
      circle(ghost.x, ghost.y, 2.6*a + 1); ctx.fill();
    }
    if (res) break;
  }

  // pull-back band
  ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 2; ctx.setLineDash([3, 5]);
  ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x - ux*Math.min(d, MAX_DRAG)*0.45, ball.y - uy*Math.min(d, MAX_DRAG)*0.45); ctx.stroke();
  ctx.setLineDash([]);

  // arrow
  const len = 22 + p*48, ex = ball.x + ux*len, ey = ball.y + uy*len;
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(ball.x + ux*12, ball.y + uy*12); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(ex + ux*11, ey + uy*11); ctx.lineTo(ex - uy*8, ey + ux*8); ctx.lineTo(ex + uy*8, ey - ux*8); ctx.fill();

  // power ring + label
  ctx.lineWidth = 5;
  ctx.strokeStyle = "rgba(0,0,0,.3)"; circle(ball.x, ball.y, 20); ctx.stroke();
  ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(ball.x, ball.y, 20, -Math.PI/2, -Math.PI/2 + p*Math.PI*2); ctx.stroke();
  ctx.font = `600 13px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.6)";
  const lx = ball.x - ux*36, ly = ball.y - uy*36;
  ctx.strokeText(Math.round(p*100) + "%", lx, ly); ctx.fillStyle = "#fff"; ctx.fillText(Math.round(p*100) + "%", lx, ly);
}

function ballColor(){
  const s = skin();
  return s.body === "rainbow" ? `hsl(${(t*200)%360},90%,65%)` : s.body;
}

function draw(){
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random()-0.5)*shake*2, (Math.random()-0.5)*shake*2);
  drawCourse();

  // trail
  trail.forEach(p => { ctx.fillStyle = p.c + (p.life*0.4) + ")"; circle(p.x, p.y, BALL_R*p.life*0.75); ctx.fill(); });

  drawAim();

  // ball
  if (ball.r > 0.3){
    ctx.fillStyle = "rgba(0,0,0,.3)"; circle(ball.x+2, ball.y+3, ball.r); ctx.fill();
    ctx.fillStyle = ballColor(); circle(ball.x, ball.y, ball.r); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1; circle(ball.x, ball.y, ball.r); ctx.stroke();
    ctx.fillStyle = "rgba(0,0,0,.13)"; circle(ball.x+1.5, ball.y+1.5, ball.r*0.72); ctx.fill();
    ctx.fillStyle = ballColor(); circle(ball.x-1.2, ball.y-1.2, ball.r*0.6); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)"; circle(ball.x-2.4, ball.y-2.6, ball.r*0.25); ctx.fill();
    if (round && round.players.length > 1 && !demo){
      ctx.strokeStyle = curPlayer().color; ctx.lineWidth = 2.5; circle(ball.x, ball.y, ball.r+2.5); ctx.stroke();
    }
    if (state === "aim" && !drag && !demo){
      const pulse = (t*1.5) % 1;
      ctx.strokeStyle = `rgba(255,255,255,${0.5*(1-pulse)})`; ctx.lineWidth = 2;
      circle(ball.x, ball.y, ball.r + 4 + pulse*14); ctx.stroke();
    }
  }

  // flag (on top so it reads as a pin)
  const [hx, hy] = level.hole;
  const near = Math.hypot(ball.x-hx, ball.y-hy) < 60;
  ctx.globalAlpha = near ? 0.4 : 1;
  ctx.strokeStyle = "#e8e8e8"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy-48); ctx.stroke();
  const wave = Math.sin(t*4)*3;
  ctx.fillStyle = round && !demo && round.players.length > 1 ? curPlayer().color : "#ff4d4d";
  ctx.beginPath(); ctx.moveTo(hx, hy-48);
  ctx.quadraticCurveTo(hx+14, hy-46+wave, hx+27, hy-42); ctx.quadraticCurveTo(hx+14, hy-38-wave, hx, hy-34); ctx.fill();
  ctx.globalAlpha = 1;

  // rings
  rings.forEach(r => { ctx.strokeStyle = r.c + r.life*0.8 + ")"; ctx.lineWidth = 3*r.life; circle(r.x, r.y, r.maxR*(1-r.life) + 4); ctx.stroke(); });

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
    if (p.square){ ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.life*8); ctx.fillRect(-p.size/2, -p.size*0.3, p.size, p.size*0.6); ctx.restore(); }
    else if (p.star) star(p.x, p.y, p.size*1.6);
    else if (p.hollow){ ctx.lineWidth = 1; circle(p.x, p.y, p.size); ctx.stroke(); }
    else { circle(p.x, p.y, p.size); ctx.fill(); }
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // floating text
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  floaters.forEach(f => {
    const a = Math.min(1, f.life / Math.min(0.4, f.max), (f.max - f.life) * 5 + 0.2);
    const scale = f.size > 40 ? 1 + Math.max(0, 0.25 - (f.max - f.life)) * 1.5 : 1;
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.font = `700 ${Math.round(f.size*scale)}px ${FONT}`;
    ctx.lineWidth = Math.max(3, f.size/6); ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineJoin = "round";
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;

  // hole intro banner
  if (banner){
    const el = banner.max - banner.life;
    const inA = Math.min(1, el*4), outA = Math.min(1, banner.life*3);
    const a = Math.min(inA, outA), slide = (1 - inA) * -60;
    ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(0, H/2-52, W, 104);
    ctx.fillStyle = banner.color; ctx.fillRect(0, H/2-52, W, 4); ctx.fillRect(0, H/2+48, W, 4);
    const bs = Math.min(1, W/800);
    ctx.font = `700 ${Math.round(44*bs)}px ${FONT}`; ctx.fillStyle = "#ffd34e"; ctx.fillText(banner.title, W/2 + slide, H/2-10);
    ctx.font = `500 ${Math.round(19*bs)}px ${FONT}`; ctx.fillStyle = "#fff"; ctx.fillText(banner.sub, W/2 - slide, H/2+26);
    ctx.globalAlpha = 1;
  }
}

const fmtDiff = d => d === 0 ? "E" : (d > 0 ? `+${d}` : `${d}`);
function playerTotal(p){
  let s = 0, par = 0;
  p.scores.forEach((v, i) => { if (v != null){ s += v; par += LEVELS[round.holes[i]].par; } });
  return { s, diff:s - par };
}

function updateHUD(){
  $("hGems").textContent = `💎 ${save.gems}`;
  $("btnMute").textContent = save.muted ? "🔇" : "🔊";
  $("btnRestart").style.display = round && round.custom && !round.practice && !demo ? "" : "none";
  if (demo || !round){
    $("hHole").textContent = "⛳ TINY TEES"; $("hName").textContent = ""; $("hPar").textContent = "";
    $("players").innerHTML = "";
    return;
  }
  $("hHole").textContent = WORLDS[round.world].emoji + " " + (round.practice ? `Practice ${levelIdx+1}` : `Hole ${round.hi+1}/${round.holes.length}`);
  $("hName").textContent = level.name;
  $("hPar").textContent = `Par ${level.par}`;
  $("players").innerHTML = round.players.map((p, i) => {
    const tt = playerTotal(p), active = i === round.pi;
    const shown = active ? `${strokes} ${strokes === 1 ? "stroke" : "strokes"}` : (tt.s ? fmtDiff(tt.diff) : "–");
    return `<span class="chip ${active ? "active" : ""}" style="--c:${p.color}"><span class="dot"></span>${p.name} <b>${shown}</b>${active && tt.s ? ` <span class="muted">(${fmtDiff(tt.diff)})</span>` : ""}</span>`;
  }).join("");
}

function showOverlay(html){ overlay.innerHTML = `<div class="card">${html}</div>`; overlay.classList.remove("hidden"); }
function hideOverlay(){ overlay.classList.add("hidden"); overlay.innerHTML = ""; }

function cellClass(v, par, cur){
  let c = v == null ? "" : v === 1 ? "ace" : v < par ? "under" : v === par ? "even" : "over";
  return c + (cur ? " cur" : "");
}
function scorecardHTML(){
  const hs = round.holes;
  const totalPar = hs.reduce((a, h) => a + LEVELS[h].par, 0);
  return `<table>
    <tr><th></th>${hs.map((h, i) => `<th>${round.practice ? h+1 : i+1}</th>`).join("")}<th>Tot</th></tr>
    <tr><th>Par</th>${hs.map(h => `<td>${LEVELS[h].par}</td>`).join("")}<td>${totalPar}</td></tr>
    ${round.players.map((p, pi) => {
      const tt = playerTotal(p);
      return `<tr><td class="name"><span class="dot" style="--c:${p.color};display:inline-block;vertical-align:-1px"></span> ${p.name}</td>
        ${hs.map((h, i) => `<td class="${cellClass(p.scores[i], LEVELS[h].par, i === round.hi && pi === round.pi && state !== "done")}">${p.scores[i] ?? "–"}</td>`).join("")}
        <td><b>${tt.s || "–"}</b></td></tr>`;

}

function checkUnlock(){
  if (round.practice || round.course !== "full" || round.world >= BUILTIN) return "";
  save.completed[WORLDS[round.world].id] = true;
  const next = WORLDS[round.world + 1];
  if (!next || save.unlocked.includes(next.id)){ persist(); return ""; }
  save.unlocked.push(next.id); persist();
  menuWorld = round.world + 1;
  setTimeout(() => sfx.unlock(), 700);
  return `<div class="unlock w-${next.theme}">🔓 New world unlocked: <b>${next.emoji} ${next.name}</b><br><small>${next.blurb}</small></div>`;
}

function showFinal(){
  const ranked = round.players.map(p => ({ p, ...playerTotal(p) })).sort((a, b) => a.s - b.s);
  const unlockHTML = checkUnlock();
  let extra = "";
  if (round.players.length === 1){
    const r = ranked[0], key = `${WORLDS[round.world].id}-${round.course}`, label = `${r.s} (${fmtDiff(r.diff)})`;
    const prev = save.roundBest[key], prevNum = prev ? parseInt(prev, 10) : Infinity;
    if (r.s < prevNum){ save.roundBest[key] = label; persist(); extra = "<p><b>🏆 New personal best!</b></p>"; }
    else extra = `<p class="muted">Best: ${prev}</p>`;
    const verdict = r.diff <= -5 ? "Legendary putting! 🏆" : r.diff < 0 ? "Under par, nicely done! 🎉" :
      r.diff === 0 ? "Right on par. Solid round! 👏" : r.diff <= 6 ? "Not bad! Go again?" : "The course won this time 😅";
    showOverlay(`<h1 class="logo" style="font-size:44px">Round complete!</h1>
      <h2 style="margin-top:8px">${label}</h2><p>${verdict}</p>${extra}${unlockHTML}
      ${round.pubId ? recordsBlock(levelIdx, `Hole ${round.hi+1} records`) + `<div class="row" style="margin-top:4px"><button class="ghost" data-act="comRecords" data-id="${esc(round.pubId)}">🏆 Full leaderboard</button></div>` : ""}
      ${scorecardHTML()}
      <div class="row"><button data-act="again">Play again</button><button class="ghost" data-act="menu">${round.custom ? "Custom maps" : "Menu"}</button></div>`);
  } else {
    const best = ranked[0].s, winners = ranked.filter(r => r.s === best);
    const title = winners.length > 1 ? "It's a tie!" : `${winners[0].p.name} wins!`;
    showOverlay(`<h1 class="logo" style="font-size:44px">🏆 ${title}</h1>
      ${unlockHTML}<ol class="standings">${ranked.map((r, i) => `<li><span>${["🥇","🥈","🥉","4."][i]}</span><span class="dot" style="--c:${r.p.color}"></span>${r.p.name}<span class="sc">${r.s} (${fmtDiff(r.diff)})</span></li>`).join("")}</ol>
      ${scorecardHTML()}
      <div class="row"><button data-act="again">Rematch</button><button class="ghost" data-act="menu">Menu</button></div>`);
  }
  confetti(W/2, H/2, 140);
  sfx.ace();
}

const ACTIONS = {
  players: d => { menuPlayers = +d.n; showMenu(); },
  course:  d => { menuCourse = d.k; showMenu(); },
  world:   d => { menuWorld = +d.w; showMenu(); },
  pworld:  d => { practiceWorld = +d.w; showPractice(); },
  play:    () => startRound(menuWorld, courseOptions(menuWorld)[menuCourse].holes, menuPlayers, false, menuCourse),
  practice:() => { if (!demo) startDemo(); showPractice(); },
  practiceHole: d => startRound(practiceWorld, [+d.i], 1, true, "practice"),
  shop:    () => showShop(),
  buy:     d => { const s = SKINS.find(x => x.id === d.id); if (save.gems < s.cost) return;
                  save.gems -= s.cost; save.owned.push(s.id); save.skin = s.id; persist(); sfx.buy(); updateHUD(); showShop(); },
  equip:   d => { save.skin = d.id; persist(); showShop(); },
  menu:    () => {
    const wasCustom = round && round.custom;
    if (ED){ edSaveNow(); ED = null; document.body.classList.remove("editing"); }
    round = null;
    if (wasCustom){ resize(); showHub(); } else showMenu();
  },
  custom:  () => showHub(),
  next:    () => nextHole(),
  retry:   () => startRound(round.world, round.holes, 1, true, round.course, roundExtras()),
  again:   () => startRound(round.world, round.holes, round.players.length, false, round.course, roundExtras()),
  resume:  d => {
    hideOverlay();
    state = d.prev === "done" ? "done" : d.prev;
    // if we paused during the short gap after sinking, continue the flow
    if (d.prev === "done") showHoleCardOrNextTurn();
  },
};
function roundExtras(){
  const { custom, test, courseRef, editHole, pubId, pubVersion } = round;
  return { custom, test, courseRef, editHole, pubId, pubVersion };
}
function showHoleCardOrNextTurn(){
  if (round.pi < round.players.length - 1 && round.players[round.pi].scores[round.hi] != null){ round.pi++; startTurn(false); }
  else if (round.players[round.pi].scores[round.hi] != null) showHoleCard();
}

overlay.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");

// Restart the current player's attempt at this hole (custom maps).
let pausedFrom = null;
function canRestart(){
  if (!round || !round.custom || round.practice || demo) return false;
  return ["aim", "rolling"].includes(state === "paused" ? pausedFrom : state);
}
function restartHole(){

// =====================================================================
//  Custom maps — data, sanitizing, sharing
// =====================================================================
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const newId = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const MAX_OBJ = 150, MAX_HOLES = 9;
const RECT_KEYS = ["walls", "sand", "water", "ice", "conveyors", "breakables"];
const EMOJIS = ["⛳","🏌️","🌴","🏰","🍭","🌋","❄️","🚀","🐉","🎃","🌈","🏝️","🍄","⭐","🦖","🎪"];

function newHole(n = 1, size = DEFAULT_SIZE){
  const [w, h] = size;
  return { name:`Hole ${n}`, par:3, size:[w, h], tee:[100, 40 + Math.round(h/2/10)*10], hole:[40 + w - 80, 40 + Math.round(h/2/10)*10], tip:"" };
}
function newCourse(){
  return { id:newId(), name:"My Course", emoji:"⛳", author:save.creator || "",
    theme:{ ...THEME_PRESETS[0] }, holes:[newHole(1)], created:Date.now(), updated:Date.now() };
}

function sanitizeHole(h, n){
  h = h && typeof h === "object" ? h : {};
  const num = (v, lo, hi, d) => Number.isFinite(+v) ? Math.max(lo, Math.min(hi, +v)) : d;
  const sw = Math.round(num(h.size && h.size[0], SIZE_MIN[0], SIZE_MAX[0], DEFAULT_SIZE[0]) / 20) * 20;
  const sh = Math.round(num(h.size && h.size[1], SIZE_MIN[1], SIZE_MAX[1], DEFAULT_SIZE[1]) / 20) * 20;
  const X = v => num(v, 40, 40 + sw, 40 + sw/2), Y = v => num(v, 40, 40 + sh, 40 + sh/2);
  const list = (a, f) => (Array.isArray(a) ? a : []).slice(0, MAX_OBJ).filter(o => o && typeof o === "object").map(f);
  const out = {
    name:String(h.name || `Hole ${n}`).slice(0, 30), par:Math.round(num(h.par, 1, 9, 3)), size:[sw, sh],
    tip:String(h.tip || "").slice(0, 60),
    tee:[X(h.tee && h.tee[0]), Y(h.tee && h.tee[1])], hole:[X(h.hole && h.hole[0]), Y(h.hole && h.hole[1])],
  };
  RECT_KEYS.forEach(k => {
    const a = list(h[k], r => {
      const o = [X(r[0]), Y(r[1]), num(r[2], 4, sw, 40), num(r[3], 4, sh, 40)];
      if (k === "conveyors") o.push(num(r[4], -360, 360, 0));
      return o;
    });
    if (a.length) out[k] = a;
  });
  const add = (k, a) => { if (a.length) out[k] = a; };
  add("bumpers", list(h.bumpers, b => [X(b[0]), Y(b[1]), num(b[2], 6, 60, 18)]));
  add("gems", list(h.gems, g => [X(g[0]), Y(g[1])]));
  add("boosts", list(h.boosts, b => [X(b[0]), Y(b[1]), num(b[2], -360, 360, 0)]));
  add("portals", list(h.portals, p => [X(p[0]), Y(p[1]), X(p[2]), Y(p[3])]).slice(0, PORTAL_COLORS.length * 3));
  add("slopes", list(h.slopes, s => ({ x:X(s.x), y:Y(s.y), r:num(s.r, 20, 300, 90), k:num(s.k, -0.4, 0.4, 0.15) || 0.15 })));
  add("movers", list(h.movers, m => ({ x:X(m.x), y:Y(m.y), w:num(m.w, 6, 400, 30), h:num(m.h, 6, 400, 60),
    ax:num(m.ax, -400, 400, 0), ay:num(m.ay, -400, 400, 40), speed:num(m.speed, 0.2, 5, 1.8) })));
  add("spinners", list(h.spinners, s => ({ x:X(s.x), y:Y(s.y), len:num(s.len, 20, 200, 66), speed:num(s.speed, -5, 5, 1.4),
    blades:Math.round(num(s.blades, 1, 8, 4)) })));
  return out;
}

function sanitizeCourse(c){
  c = c && typeof c === "object" ? c : {};
  const t = c.theme || {};

// ---- share codes: deflate + base64url, so a whole course fits in a link ----
const b64u = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
async function encodeCourse(c){
  const bytes = new TextEncoder().encode(JSON.stringify(stripCourse(c)));
  if (window.CompressionStream){
    const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return "z" + b64u(new Uint8Array(await new Response(cs).arrayBuffer()));
  }
  return "j" + b64u(bytes);
}
async function decodeCourse(text){
  let code = String(text).trim();
  const m = code.match(/[#&?]map=([A-Za-z0-9_-]+)/); if (m) code = m[1];
  if (!/^[zj][A-Za-z0-9_-]+$/.test(code)) throw new Error("That doesn't look like a map code.");
  const bytes = unb64u(code.slice(1));
  let json;
  if (code[0] === "z"){
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    json = await new Response(ds).text();
  } else json = new TextDecoder().decode(bytes);
  if (json.length > 400000) throw new Error("Map is too big.");
  return sanitizeCourse({ ...JSON.parse(json), id:newId() });
}
const shareUrl = code => `${location.origin}${location.pathname}#map=${code}`;
const pubUrl = id => `${location.origin}${location.pathname}#pub=${id}`;
