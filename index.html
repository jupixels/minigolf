// ---- object helpers ----
function objRef(sel){ const h = eh(); return sel.key === "tee" || sel.key === "hole" ? h[sel.key] : (h[sel.key] || [])[sel.i]; }
const objExists = sel => !!objRef(sel);

function boundsOf(sel){
  const o = objRef(sel), k = sel.key;
  if (k === "tee" || k === "hole") return [o[0]-14, o[1]-14, 28, 28];
  if (RECT_KEYS.includes(k)) return [o[0], o[1], o[2], o[3]];
  if (k === "gems") return [o[0]-10, o[1]-13, 20, 26];
  if (k === "boosts") return [o[0]-24, o[1]-24, 48, 48];
  if (k === "portals"){ const j = (sel.part || 0)*2; return [o[j]-18, o[j+1]-18, 36, 36]; }
  if (k === "bumpers") return [o[0]-o[2], o[1]-o[2], o[2]*2, o[2]*2];
  if (k === "slopes") return [o.x-o.r, o.y-o.r, o.r*2, o.r*2];
  if (k === "spinners") return [o.x-o.len, o.y-o.len, o.len*2, o.len*2];
  if (k === "movers") return [o.x-o.w/2, o.y-o.h/2, o.w, o.h];
  return [0, 0, 0, 0];
}
function handleOf(sel){
  const o = objRef(sel), k = sel.key;
  if (!o) return null;
  if (RECT_KEYS.includes(k)) return [o[0]+o[2], o[1]+o[3]];
  if (k === "movers") return [o.x+o.w/2, o.y+o.h/2];
  if (k === "bumpers") return [o[0]+o[2], o[1]];
  if (k === "slopes") return [o.x+o.r, o.y];
  if (k === "spinners") return [o.x+o.len, o.y];
  return null;
}

function hitTest(x, y){
  const h = eh(), near = (px, py, r) => Math.hypot(x-px, y-py) <= r;
  const inR = (r, pad = 3) => x >= r[0]-pad && x <= r[0]+r[2]+pad && y >= r[1]-pad && y <= r[1]+r[3]+pad;
  const rev = (k, f) => { const a = h[k] || []; for (let i = a.length - 1; i >= 0; i--) if (f(a[i], i)) return i; return -1; };
  let i;
  if (near(h.tee[0], h.tee[1], 15)) return { key:"tee" };
  if (near(h.hole[0], h.hole[1], 16)) return { key:"hole" };
  if ((i = rev("gems", g => near(g[0], g[1], 13))) >= 0) return { key:"gems", i };
  for (let j = (h.portals || []).length - 1; j >= 0; j--){
    const p = h.portals[j];
    if (near(p[0], p[1], 17)) return { key:"portals", i:j, part:0 };
    if (near(p[2], p[3], 17)) return { key:"portals", i:j, part:1 };
  }
  if ((i = rev("boosts", b => near(b[0], b[1], 22))) >= 0) return { key:"boosts", i };
  if ((i = rev("spinners", s => near(s.x, s.y, 18) || (Math.hypot(x-s.x, y-s.y) <= s.len && ED.sel && ED.sel.key === "spinners"))) >= 0) return { key:"spinners", i };
  if ((i = rev("bumpers", b => near(b[0], b[1], b[2] + 3))) >= 0) return { key:"bumpers", i };
  if ((i = rev("movers", m => inR([m.x-m.w/2, m.y-m.h/2, m.w, m.h], 5))) >= 0) return { key:"movers", i };
  for (const k of ["breakables", "walls", "conveyors", "ice", "water", "sand"])
    if ((i = rev(k, r => inR(r))) >= 0) return { key:k, i };
  if ((i = rev("slopes", s => near(s.x, s.y, s.r * 0.75))) >= 0) return { key:"slopes", i };
  return null;
}

function moveObj(sel, orig, dx, dy){
  const o = objRef(sel), k = sel.key;
  if (k === "portals"){ const j = (sel.part || 0)*2; o[j] = clampX(sn(orig[j]+dx)); o[j+1] = clampY(sn(orig[j+1]+dy)); return; }
  if (Array.isArray(o)){
    if (RECT_KEYS.includes(k)){
      o[0] = Math.max(MIN_X, Math.min(MAX_X - Math.min(o[2], MAX_X-MIN_X), sn(orig[0]+dx)));
      o[1] = Math.max(MIN_Y, Math.min(MAX_Y - Math.min(o[3], MAX_Y-MIN_Y), sn(orig[1]+dy)));
    } else { o[0] = clampX(sn(orig[0]+dx)); o[1] = clampY(sn(orig[1]+dy)); }
  } else { o.x = clampX(sn(orig.x+dx)); o.y = clampY(sn(orig.y+dy)); }
}
function resizeObj(sel, p){
  const o = objRef(sel), k = sel.key;
  if (RECT_KEYS.includes(k)){ o[2] = Math.max(8, Math.min(MAX_X - o[0], sn(p.x) - o[0])); o[3] = Math.max(8, Math.min(MAX_Y - o[1], sn(p.y) - o[1])); }
  else if (k === "movers"){ o.w = Math.max(8, sn(2*Math.abs(p.x - o.x))); o.h = Math.max(8, sn(2*Math.abs(p.y - o.y))); }
  else if (k === "bumpers") o[2] = Math.round(Math.max(6, Math.min(60, Math.hypot(p.x-o[0], p.y-o[1]))));
  else if (k === "slopes") o.r = Math.round(Math.max(20, Math.min(300, Math.hypot(p.x-o.x, p.y-o.y))));
  else if (k === "spinners") o.len = Math.round(Math.max(20, Math.min(200, Math.hypot(p.x-o.x, p.y-o.y))));
}
function removeSel(){
  const s = ED.sel; if (!s || s.key === "tee" || s.key === "hole") return;
  edBegin(); eh()[s.key].splice(s.i, 1); if (!eh()[s.key].length) delete eh()[s.key];
  ED.sel = null; edCommit(); edRebuild();
}
function duplicateSel(fromClip){
  const src = fromClip ? ED.clip : ED.sel && ED.sel.key !== "tee" && ED.sel.key !== "hole" ? { key:ED.sel.key, obj:objRef(ED.sel) } : null;
  if (!src) return;
  if (countObjs(eh()) >= MAX_OBJ) return toast(`This hole is full (max ${MAX_OBJ} objects)`);
  edBegin();
  const o = JSON.parse(JSON.stringify(src.obj)), d = 20;
  if (Array.isArray(o)){ o[0] += d; o[1] += d; if (src.key === "portals"){ o[2] += d; o[3] += d; } } else { o.x += d; o.y += d; }
  arrOf(eh(), src.key).push(o);
  ED.sel = { key:src.key, i:eh()[src.key].length - 1, part:0 };
  if (fromClip) ED.clip = { key:src.key, obj:JSON.parse(JSON.stringify(o)) };
  edCommit(); edRebuild();
}
function rotateSel(step = 45){
  const s = ED.sel; if (!s) return;
  const o = objRef(s);
  edBegin();
  if (s.key === "boosts") o[2] = (o[2] + step + 360) % 360;
  else if (s.key === "conveyors") o[4] = (o[4] + step + 360) % 360;
  else if (RECT_KEYS.includes(s.key) || s.key === "movers"){
    if (Array.isArray(o)){ const cx = o[0]+o[2]/2, cy = o[1]+o[3]/2; [o[2], o[3]] = [o[3], o[2]]; o[0] = sn(cx-o[2]/2); o[1] = sn(cy-o[3]/2); }
    else { [o.w, o.h] = [o.h, o.w]; [o.ax, o.ay] = [o.ay, o.ax]; }
  } else if (s.key === "spinners") o.speed = -o.speed;
  edCommit(); edRebuild();
}
function clampAll(h){
  const fx = v => clampX(v), fy = v => clampY(v);
  h.tee = [fx(h.tee[0]), fy(h.tee[1])]; h.hole = [fx(h.hole[0]), fy(h.hole[1])];
  RECT_KEYS.forEach(k => (h[k] || []).forEach(r => {
    r[2] = Math.min(r[2], MAX_X-MIN_X); r[3] = Math.min(r[3], MAX_Y-MIN_Y);
    r[0] = Math.max(MIN_X, Math.min(MAX_X - r[2], r[0])); r[1] = Math.max(MIN_Y, Math.min(MAX_Y - r[3], r[1]));
  }));
  ["bumpers", "gems", "boosts"].forEach(k => (h[k] || []).forEach(o => { o[0] = fx(o[0]); o[1] = fy(o[1]); }));
  (h.portals || []).forEach(p => { p[0] = fx(p[0]); p[1] = fy(p[1]); p[2] = fx(p[2]); p[3] = fy(p[3]); });
  ["slopes", "movers", "spinners"].forEach(k => (h[k] || []).forEach(o => { o.x = fx(o.x); o.y = fy(o.y); }));
}

// ---- warnings shown in the panel ----
function holeWarnings(h){
  const W_ = [];
  const inAny = (p, keys) => keys.some(k => (h[k] || []).some(r => inRect(p[0], p[1], r)));
  if (inAny(h.tee, ["walls", "breakables"])) W_.push("The tee is inside a wall.");
  if (inAny(h.tee, ["water"])) W_.push("The tee is in a hazard — every shot would splash.");
  if (inAny(h.hole, ["walls", "breakables"])) W_.push("The hole is inside a wall, so it can't be reached.");
  if (inAny(h.hole, ["water"])) W_.push("The hole is inside a hazard.");
  if (Math.hypot(h.tee[0]-h.hole[0], h.tee[1]-h.hole[1]) < 40) W_.push("The tee and hole are very close together.");
  if ((h.portals || []).some(p => Math.hypot(p[0]-p[2], p[1]-p[3]) < 40)) W_.push("A portal's two ends are almost on top of each other.");
  return W_;
}

// ---- inspector panel ----
function fieldsFor(sel){
  const o = objRef(sel), k = sel.key, F = [];
  const P = (label, get, set, min, max, step = 1) => F.push({ label, get, set, min, max, step });
  const xyA = (ix, iy, lx = "X", ly = "Y") => { P(lx, () => o[ix], v => o[ix] = v, MIN_X, MAX_X); P(ly, () => o[iy], v => o[iy] = v, MIN_Y, MAX_Y); };
  const xyO = () => { P("X", () => o.x, v => o.x = v, MIN_X, MAX_X); P("Y", () => o.y, v => o.y = v, MIN_Y, MAX_Y); };
  if (k === "tee" || k === "hole" || k === "gems") xyA(0, 1);
  else if (RECT_KEYS.includes(k)){ xyA(0, 1); P("Width", () => o[2], v => o[2] = v, 8, MAX_X-MIN_X); P("Height", () => o[3], v => o[3] = v, 8, MAX_Y-MIN_Y); }
  else if (k === "bumpers"){ xyA(0, 1); P("Size", () => o[2], v => o[2] = v, 6, 60); }
  else if (k === "boosts") xyA(0, 1);
  else if (k === "portals"){ xyA(0, 1, "A · X", "A · Y"); xyA(2, 3, "B · X", "B · Y"); }
  else if (k === "slopes"){ xyO(); P("Radius", () => o.r, v => o.r = v, 20, 300);
    P("Strength", () => Math.abs(o.k), v => o.k = Math.sign(o.k || 1) * v, 0.04, 0.4, 0.01); }
  else if (k === "movers"){ xyO(); P("Width", () => o.w, v => o.w = v, 8, 400); P("Height", () => o.h, v => o.h = v, 8, 400);
    P("Slide X", () => o.ax, v => o.ax = v, -300, 300); P("Slide Y", () => o.ay, v => o.ay = v, -300, 300);
    P("Speed", () => o.speed, v => o.speed = v, 0.2, 5, 0.1); }
  else if (k === "spinners"){ xyO(); P("Arm length", () => o.len, v => o.len = v, 20, 200);
    P("Speed", () => o.speed, v => o.speed = v, -4, 4, 0.1); P("Arms", () => o.blades, v => o.blades = Math.round(v), 1, 6); }
  return F;
}

function renderPanel(){

    html += panelFields.map((f, i) => `<label class="fld"><span>${f.label}</span>
      <input type="range" data-fi="${i}" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.get()}">
      <input type="number" data-fi="${i}" min="${f.min}" max="${f.max}" step="${f.step}" value="${+(+f.get()).toFixed(2)}"></label>`).join("");
    if (k === "boosts" || k === "conveyors"){
      const a = ((k === "boosts" ? o[2] : o[4]) % 360 + 360) % 360;
      html += `<div class="sub">Direction</div><div class="dirs">${DIRS.map(([d, ch]) => `<button data-dir="${d}" class="${Math.abs(a - d) < 1 ? "on" : ""}">${ch}</button>`).join("")}</div>`;
    }
    if (k === "slopes") html += `<div class="dirs" style="grid-template-columns:1fr 1fr;margin-top:8px">
      <button data-slope="1" class="${o.k > 0 ? "on" : ""}">⛰️ Hill</button><button data-slope="-1" class="${o.k < 0 ? "on" : ""}">🕳️ Dip</button></div>`;
    if (k === "gems") html += `<p class="sub">Gems in custom maps sparkle when collected but don't add to your 💎 wallet.</p>`;
    if (k === "breakables") html += `<p class="sub">Shatters when the ball hits it hard. Resets for every player's turn.</p>`;
    if (k === "water") html += `<p class="sub">Looks like ${HAZARD_STYLES[ED.course.theme.style].toLowerCase()} with this theme (change it in 🎨).</p>`;
    html += `<div class="pbtns">${k !== "tee" && k !== "hole" ? `<button class="ghost" data-pa="dup">⧉ Duplicate</button><button class="ghost" data-pa="del">🗑 Delete</button>` : ""}
      ${["boosts","conveyors","walls","sand","water","ice","breakables","movers"].includes(k) ? `<button class="ghost" data-pa="rot">⟳ Rotate</button>` : ""}
      <button class="ghost" data-pa="desel">Done</button></div>`;
  } else {
    const n = countObjs(h), warns = holeWarnings(h);
    html += `<h4>Hole ${ED.hi+1} settings</h4>
      <label class="fld2"><span>Name</span><input type="text" data-hf="name" maxlength="30" value="${esc(h.name)}"></label>
      <label class="fld"><span>Par</span><input type="range" data-hf="par" min="1" max="9" value="${h.par}"><input type="number" data-hf="par" min="1" max="9" value="${h.par}"></label>
      <label class="fld2"><span>Hint</span><input type="text" data-hf="tip" maxlength="60" placeholder="Optional message at the start" value="${esc(h.tip)}"></label>
      <div class="sub">Course size</div>
      <label class="fld"><span>Width</span><input type="range" data-hf="w" min="${SIZE_MIN[0]}" max="${SIZE_MAX[0]}" step="20" value="${h.size[0]}"><input type="number" data-hf="w" min="${SIZE_MIN[0]}" max="${SIZE_MAX[0]}" step="20" value="${h.size[0]}"></label>
      <label class="fld"><span>Height</span><input type="range" data-hf="h" min="${SIZE_MIN[1]}" max="${SIZE_MAX[1]}" step="20" value="${h.size[1]}"><input type="number" data-hf="h" min="${SIZE_MIN[1]}" max="${SIZE_MAX[1]}" step="20" value="${h.size[1]}"></label>
      <div class="chips">${SIZE_PRESETS.map(([nm, s]) => `<button data-size="${s.join("x")}" class="${s[0] === h.size[0] && s[1] === h.size[1] ? "on" : ""}">${nm}</button>`).join("")}</div>
      ${warns.map(w => `<div class="warn">⚠️ ${w}</div>`).join("")}
      <div class="sub">${n} / ${MAX_OBJ} objects on this hole</div>
      <div class="pbtns">
        <button class="ghost" data-pa="dupHole" ${ED.course.holes.length >= MAX_HOLES ? "disabled" : ""}>⧉ Copy hole</button>
        <button class="ghost" data-pa="delHole" ${ED.course.holes.length <= 1 ? "disabled" : ""}>🗑 Delete hole</button>
        <button class="ghost" data-pa="left" ${ED.hi === 0 ? "disabled" : ""}>◀</button>
        <button class="ghost" data-pa="right" ${ED.hi >= ED.course.holes.length - 1 ? "disabled" : ""}>▶</button>
        <button class="ghost" data-pa="clear">Clear hole</button>
      </div>
      <details class="keys"><summary>How to build</summary>
        Pick something on the left, then click (or drag) on the course. Use 👆 to select, drag to move, and pull the
        <b style="color:var(--accent)">■</b> handle to resize.<br>
        <kbd>Del</kbd> delete · <kbd>Ctrl</kbd>+<kbd>Z</kbd>/<kbd>Y</kbd> undo/redo · <kbd>Ctrl</kbd>+<kbd>C</kbd>/<kbd>V</kbd>/<kbd>D</kbd> copy/paste/duplicate ·
        <kbd>R</kbd> rotate · arrow keys nudge · <kbd>G</kbd> snap · <kbd>T</kbd> test · <kbd>V</kbd> select · <kbd>E</kbd> eraser · hold <kbd>Alt</kbd> to place freely
      </details>`;
  }
  el.innerHTML = html;
}

function panelInput(e, commit){
  const t = e.target, h = eh();
  if (t.dataset.fi != null){
    const f = panelFields[+t.dataset.fi]; if (!f) return;
    let v = parseFloat(t.value); if (!Number.isFinite(v)) return;
    v = Math.max(f.min, Math.min(f.max, v));
    if (ED.before == null) edBegin();
    f.set(v);
    t.parentNode.querySelectorAll(`[data-fi="${t.dataset.fi}"]`).forEach(x => { if (x !== t) x.value = +v.toFixed(2); });
    edRebuild(false);
    if (commit) edCommit();
  } else if (t.dataset.hf){
    const k = t.dataset.hf;
    if (ED.before == null) edBegin();
    if (k === "name"){ h.name = t.value.slice(0, 30); $("edHoles").querySelector(`[data-i="${ED.hi}"]`).title = h.name; }
    else if (k === "tip") h.tip = t.value.slice(0, 60);
    else {
      let v = parseInt(t.value, 10); if (!Number.isFinite(v)) return;
      if (k === "par") h.par = Math.max(1, Math.min(9, v));
      if (k === "w") h.size[0] = Math.max(SIZE_MIN[0], Math.min(SIZE_MAX[0], Math.round(v/20)*20));
      if (k === "h") h.size[1] = Math.max(SIZE_MIN[1], Math.min(SIZE_MAX[1], Math.round(v/20)*20));
      t.parentNode.querySelectorAll(`[data-hf="${k}"]`).forEach(x => { if (x !== t) x.value = v; });
      if (k === "w" || k === "h"){ applySize(h.size); clampAll(h); }
    }
    edRebuild(false);
    if (commit){ edCommit(); if (k === "w" || k === "h") renderPanel(); }
  }
}

function panelClick(e){
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const h = eh(), c = ED.course;
  if (b.dataset.dir != null){
    edBegin(); const o = objRef(ED.sel);
    if (ED.sel.key === "boosts") o[2] = +b.dataset.dir; else o[4] = +b.dataset.dir;
    edCommit(); edRebuild(); return;
  }
  if (b.dataset.slope){ edBegin(); const o = objRef(ED.sel); o.k = Math.abs(o.k) * +b.dataset.slope; edCommit(); edRebuild(); return; }
  if (b.dataset.size){
    edBegin(); const [w, hh] = b.dataset.size.split("x").map(Number);
    h.size = [w, hh]; applySize(h.size); clampAll(h); edCommit(); edRebuild(); return;
  }
  const a = b.dataset.pa;
  if (a === "del") removeSel();
  if (a === "dup") duplicateSel(false);
  if (a === "rot") rotateSel(ED.sel.key === "boosts" || ED.sel.key === "conveyors" ? 45 : 90);
  if (a === "desel"){ ED.sel = null; renderPanel(); }
  if (a === "dupHole" && c.holes.length < MAX_HOLES){
    edBegin(); const copy = JSON.parse(JSON.stringify(h)); copy.name = (h.name + " copy").slice(0, 30);
    c.holes.splice(ED.hi + 1, 0, copy); ED.hi++; edCommit(); renderEdTop(); edRebuild();
  }
  if (a === "delHole" && c.holes.length > 1){
    if (b.dataset.armed !== "1"){ b.dataset.armed = "1"; b.textContent = "Tap again to delete"; return; }
    edBegin(); c.holes.splice(ED.hi, 1); ED.hi = Math.max(0, ED.hi - 1); edCommit(); renderEdTop(); edRebuild();
  }
  if ((a === "left" && ED.hi > 0) || (a === "right" && ED.hi < c.holes.length - 1)){
    edBegin(); const j = ED.hi + (a === "left" ? -1 : 1);
    [c.holes[ED.hi], c.holes[j]] = [c.holes[j], c.holes[ED.hi]]; ED.hi = j; edCommit(); renderEdTop(); edRebuild();
  }
  if (a === "clear"){
    if (b.dataset.armed !== "1"){ b.dataset.armed = "1"; b.textContent = "Tap again to clear"; return; }
    edBegin(); const keep = { name:h.name, par:h.par, size:h.size, tee:h.tee, hole:h.hole, tip:h.tip };
    Object.keys(h).forEach(k => delete h[k]); Object.assign(h, keep); edCommit(); edRebuild();
  }
}

// ---- canvas interaction ----
function edPointerDown(p, e){
  const h = eh(), tool = ED.tool, free = e.altKey;
  const x = free ? Math.round(clampX(p.x)) : clampX(sn(p.x)), y = free ? Math.round(clampY(p.y)) : clampY(sn(p.y));
  if (tool === "select"){
    if (ED.sel){
      const hd = handleOf(ED.sel);
      if (hd && Math.hypot(p.x-hd[0], p.y-hd[1]) <= 11){ edBegin(); ED.op = { type:"resize" }; return; }
    }
    const hit = hitTest(p.x, p.y);
    ED.sel = hit; renderPanel();
    if (hit){ edBegin(); ED.op = { type:"move", start:{ x:p.x, y:p.y }, orig:JSON.parse(JSON.stringify(objRef(hit))) }; }
    return;
  }
  if (tool === "erase"){ edBegin(); ED.op = { type:"erase" }; eraseAt(p); return; }
  if (tool === "tee" || tool === "hole"){
    edBegin(); h[tool] = [x, y]; ED.sel = { key:tool };
    ED.op = { type:"move", start:{ x:p.x, y:p.y }, orig:[x, y] }; edRebuild(); return;
  }
  if (countObjs(h) >= MAX_OBJ) return toast(`This hole is full (max ${MAX_OBJ} objects)`);
  const T = ED_TOOLS.find(t => t.id === tool);
  if (T.kind === "rect"){ ED.op = { type:"create", x0:x, y0:y, x1:x, y1:y, def:T.def, key:tool }; return; }
  edBegin();
  let sel;
  if (T.kind === "circle"){ arrOf(h, "bumpers").push([x, y, 18]); sel = { key:"bumpers", i:h.bumpers.length-1 }; }
  else if (tool === "boosts"){ arrOf(h, "boosts").push([x, y, 0]); sel = { key:"boosts", i:h.boosts.length-1 }; }
  else if (tool === "gems"){ arrOf(h, "gems").push([x, y]); sel = { key:"gems", i:h.gems.length-1 }; }
  else if (T.kind === "portal"){
    if ((h.portals || []).length >= PORTAL_COLORS.length * 3){ ED.before = null; return toast("That's the most portals one hole can have"); }
    if (!ED.pendingPortal){ ED.pendingPortal = [x, y]; ED.before = null; toast("Now click where the other end goes"); return; }
    arrOf(h, "portals").push([...ED.pendingPortal, x, y]); ED.pendingPortal = null;
    sel = { key:"portals", i:h.portals.length-1, part:1 };
  }
  else if (T.kind === "slope"){ arrOf(h, "slopes").push({ x, y, r:90, k:tool === "hills" ? 0.18 : -0.14 }); sel = { key:"slopes", i:h.slopes.length-1 }; }
  else if (T.kind === "mover"){ arrOf(h, "movers").push({ x, y, w:30, h:60, ax:0, ay:40, speed:1.8 }); sel = { key:"movers", i:h.movers.length-1 }; }
  else if (T.kind === "spinner"){ arrOf(h, "spinners").push({ x, y, len:66, speed:1.4, blades:4 }); sel = { key:"spinners", i:h.spinners.length-1 }; }
  ED.sel = sel; edCommit(); edRebuild();
}
function eraseAt(p){
  const hit = hitTest(p.x, p.y);
  if (hit && hit.key !== "tee" && hit.key !== "hole"){
    eh()[hit.key].splice(hit.i, 1); if (!eh()[hit.key].length) delete eh()[hit.key];
    ED.sel = null; edRebuild();
    burst(p.x, p.y, "#ffffff", 8, 2);
  }
}
function edPointerMove(p, e){
  ED.hover = p;
  const op = ED.op; if (!op) return;
  if (op.type === "create"){ op.x1 = e.altKey ? Math.round(clampX(p.x)) : clampX(sn(p.x)); op.y1 = e.altKey ? Math.round(clampY(p.y)) : clampY(sn(p.y)); }
  else if (op.type === "move"){
    const snapWas = ED.snap; if (e.altKey) ED.snap = false;
    moveObj(ED.sel, op.orig, p.x - op.start.x, p.y - op.start.y);
    ED.snap = snapWas; edRebuild(false);
  }
  else if (op.type === "resize"){ resizeObj(ED.sel, p); edRebuild(false); }
  else if (op.type === "erase") eraseAt(p);
}
function edPointerUp(){
  const op = ED.op; ED.op = null; if (!op) return;
  if (op.type === "create"){
    const h = eh();
    let x = Math.min(op.x0, op.x1), y = Math.min(op.y0, op.y1), w = Math.abs(op.x1 - op.x0), hh = Math.abs(op.y1 - op.y0);
    if (w < 8 || hh < 8){ [w, hh] = op.def; x = sn(op.x0 - w/2); y = sn(op.y0 - hh/2); }
    w = Math.min(w, MAX_X - MIN_X); hh = Math.min(hh, MAX_Y - MIN_Y);
    x = Math.max(MIN_X, Math.min(MAX_X - w, x)); y = Math.max(MIN_Y, Math.min(MAX_Y - hh, y));
    edBegin();
    const r = [x, y, w, hh]; if (op.key === "conveyors") r.push(0);
    arrOf(h, op.key).push(r);
    ED.sel = { key:op.key, i:h[op.key].length - 1 };
    edCommit(); edRebuild();
    return;
  }
  edCommit();
  renderPanel();
}

function edKey(e){
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return false;
  if (!overlay.classList.contains("hidden")){ if (e.key === "Escape"){ hideOverlay(); return true; } return false; }
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === "z"){ e.shiftKey ? edRedo() : edUndo(); return true; }
  if (mod && k === "y"){ edRedo(); return true; }
  if (mod && k === "c" && ED.sel && ED.sel.key !== "tee" && ED.sel.key !== "hole"){ ED.clip = { key:ED.sel.key, obj:JSON.parse(JSON.stringify(objRef(ED.sel))) }; toast("Copied"); return true; }
  if (mod && k === "v" && ED.clip){ duplicateSel(true); return true; }
  if (mod && k === "d"){ duplicateSel(false); return true; }
  if (mod) return false;
  if (k === "delete" || k === "backspace"){ removeSel(); return true; }
  if (k === "escape"){ if (ED.pendingPortal) ED.pendingPortal = null; else if (ED.sel){ ED.sel = null; renderPanel(); } else setTool("select"); return true; }
  if (k === "r"){ rotateSel(ED.sel && (ED.sel.key === "boosts" || ED.sel.key === "conveyors") ? 45 : 90); return true; }
  if (k === "g"){ ED.snap = !ED.snap; renderEdTop(); toast(ED.snap ? "Snap to grid on" : "Snap to grid off"); return true; }
  if (k === "t"){ edTest(); return true; }
  if (k === "v"){ setTool("select"); return true; }
  if (k === "e"){ setTool("erase"); return true; }
  if (k.startsWith("arrow") && ED.sel){
    const d = e.shiftKey ? 20 : ED.snap ? 10 : 1, o = JSON.parse(JSON.stringify(objRef(ED.sel)));
    const dx = k === "arrowleft" ? -d : k === "arrowright" ? d : 0, dy = k === "arrowup" ? -d : k === "arrowdown" ? d : 0;
    edBegin(); const snapWas = ED.snap; ED.snap = false; moveObj(ED.sel, o, dx, dy); ED.snap = snapWas; edCommit(); edRebuild();
    return true;
  }
  return false;
}

function edTest(){
  edSaveNow();
  const warns = holeWarnings(eh());
  playCourse(ED.course, [ED.hi], 1, { test:true, editHole:ED.hi });
  document.body.classList.remove("editing");
  resize();
  if (warns.length) toast("⚠️ " + warns[0]);
}
function backToEditor(){
  const c = round && round.courseRef, hi = round ? round.editHole || 0 : 0;
  token++;
  if (c) openEditor(c, hi);
}

// ---- editor overlay drawing ----
function drawEditor(){
  const h = eh();
  ctx.save();
  // grid
  if (ED.snap){
    ctx.fillStyle = lum(theme().fairA) > 0.55 ? "rgba(0,0,0,.14)" : "rgba(255,255,255,.12)";
    for (let x = MIN_X; x <= MAX_X; x += 20) for (let y = MIN_Y; y <= MAX_Y; y += 20) ctx.fillRect(x-1, y-1, 2, 2);
  }
  // mover paths
  ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,.55)";
  (h.movers || []).forEach(m => {
    ctx.beginPath(); ctx.moveTo(m.x - m.ax, m.y - m.ay); ctx.lineTo(m.x + m.ax, m.y + m.ay); ctx.stroke();
    ctx.strokeRect(m.x - m.ax - m.w/2, m.y - m.ay - m.h/2, m.w, m.h); ctx.strokeRect(m.x + m.ax - m.w/2, m.y + m.ay - m.h/2, m.w, m.h);
  });
  // portal links
  (h.portals || []).forEach((p, i) => {
    ctx.strokeStyle = hexToRgba(PORTAL_COLORS[i % PORTAL_COLORS.length]) + ".8)";
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[2], p[3]); ctx.stroke();
  });
  // boost & conveyor direction arrows (static, easier to read while editing)
  ctx.setLineDash([]);
  // tee label
  ctx.font = `700 11px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.fillStyle = "#fff";
  ctx.strokeText("TEE", h.tee[0], h.tee[1] - 22); ctx.fillText("TEE", h.tee[0], h.tee[1] - 22);
  // pending portal
  if (ED.pendingPortal){
    const [px, py] = ED.pendingPortal, pulse = (t*2) % 1;
    ctx.strokeStyle = PORTAL_COLORS[(h.portals || []).length % PORTAL_COLORS.length]; ctx.lineWidth = 3;
    circle(px, py, 14 + pulse*8); ctx.stroke();
    if (ED.hover){ ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ED.hover.x, ED.hover.y); ctx.stroke(); ctx.setLineDash([]); }
  }
  // rectangle being drawn
  if (ED.op && ED.op.type === "create"){
    const o = ED.op, x = Math.min(o.x0, o.x1), y = Math.min(o.y0, o.y1), w = Math.abs(o.x1-o.x0), hh = Math.abs(o.y1-o.y0);
    ctx.fillStyle = "rgba(255,211,78,.25)"; ctx.fillRect(x, y, w, hh);
    ctx.strokeStyle = "#ffd34e"; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.strokeRect(x, y, w, hh); ctx.setLineDash([]);
    if (w && hh){ ctx.fillStyle = "#fff"; ctx.font = `600 12px ${FONT}`; ctx.fillText(`${w} × ${hh}`, x + w/2, y + hh/2); }
  }
  // hover highlight (select tool)
  if (ED.tool === "select" && ED.hover && !ED.op){
    const hv = hitTest(ED.hover.x, ED.hover.y);
    if (hv && !(ED.sel && hv.key === ED.sel.key && hv.i === ED.sel.i && hv.part === ED.sel.part)){
      const b = boundsOf(hv); ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
      ctx.strokeRect(b[0]-3, b[1]-3, b[2]+6, b[3]+6); ctx.setLineDash([]);
    }
  }
  if (ED.tool === "erase" && ED.hover){
    const hv = hitTest(ED.hover.x, ED.hover.y);
    if (hv && hv.key !== "tee" && hv.key !== "hole"){ const b = boundsOf(hv); ctx.fillStyle = "rgba(255,80,80,.3)"; ctx.fillRect(b[0]-3, b[1]-3, b[2]+6, b[3]+6); }
  }
  // selection
  if (ED.sel && objExists(ED.sel)){
    const b = boundsOf(ED.sel);
    ctx.strokeStyle = "#ffd34e"; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.lineDashOffset = -t*20;
    ctx.strokeRect(b[0]-4, b[1]-4, b[2]+8, b[3]+8); ctx.setLineDash([]);
    const hd = handleOf(ED.sel);
    if (hd){ ctx.fillStyle = "#ffd34e"; ctx.strokeStyle = "#2a2100"; ctx.lineWidth = 2; ctx.fillRect(hd[0]-6, hd[1]-6, 12, 12); ctx.strokeRect(hd[0]-6, hd[1]-6, 12, 12); }
  }
  ctx.restore();
}

// ---- hole records (community maps) ----
const MEDALS = ["🥇", "🥈", "🥉"];
const strHash = str => { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); };
const playerName = () => (save.creator || "").trim().slice(0, 24) || "Anonymous golfer";
function groupRecords(list){
  const by = {};
  list.forEach(x => { if (Number.isInteger(x.hole) && Number.isInteger(x.strokes)) (by[x.hole] = by[x.hole] || []).push(x); });
  Object.values(by).forEach(a => a.sort((p, q) => p.strokes - q.strokes || p.at - q.at));
  return by;
}
async function loadRoundRecords(){
  const r = round, com = community(); if (!r || !r.pubId || !com) return;
  try {
    await com.ready;
    const list = await com.scores(r.pubId, r.pubVersion || 0);
    if (round !== r) return;
    // keep any score we just set optimistically
    const mine = r.records ? Object.values(r.records).flat().filter(x => x.local) : [];
    r.records = groupRecords([...list.filter(x => !mine.some(m => m.uid === x.uid && m.hole === x.hole && m.strokes <= x.strokes)), ...mine]);
    r.recordsOk = true;
    announceRecord();
  } catch(e){ r.recordsOk = false; }
}
function announceRecord(){
  if (!round || !round.records || state !== "aim" || strokes || round.announced === round.hi + "-" + round.pi) return;
  round.announced = round.hi + "-" + round.pi;
  const top = (round.records[levelIdx] || [])[0];
  const text = top ? `🏆 Record: ${top.strokes} stroke${top.strokes === 1 ? "" : "s"} by ${top.name}` : "🏆 No record on this hole yet. Set the first one!";
  floaters.push({ x:W/2, y:21, text, life:4.5, max:4.5, size:15, color:"#ffd34e" });
}
function recordScore(){
  if (round.players.length !== 1 || round.practice){ round.placeMsg = round.players.length > 1 ? "Hole records only count in solo play." : ""; return; }
  const com = community(); if (!com || !com.uid) return;
  const r = round, hole = levelIdx, s = strokes, name = playerName();
  r.records = r.records || {};
  const list = r.records[hole] = (r.records[hole] || []).slice();
  const old = list.find(x => x.uid === com.uid);
  if (old && old.strokes <= s){ r.placeMsg = `Your best here is still ${old.strokes}.`; return; }
  const before = list.slice(0, 3).map(x => x.uid);
  if (old) list.splice(list.indexOf(old), 1);
  list.push({ uid:com.uid, name, hole, strokes:s, at:Date.now(), local:true });
  list.sort((p, q) => p.strokes - q.strokes || p.at - q.at);
  const place = list.findIndex(x => x.uid === com.uid);
  if (place === 0 && before[0] !== com.uid){ r.placeMsg = "🥇 New hole record!"; sfx.unlock(); }
  else if (place < 3) r.placeMsg = `${MEDALS[place]} You're ${["1st","2nd","3rd"][place]} on this hole!`;
  else r.placeMsg = "Personal best on this hole ✓";
  if (place < 3) floaters.push({ x:W/2, y:H/2 + 46, text:r.placeMsg, life:2, max:2, size:22, color:"#ffd34e", rise:0.2 });
  com.submitScore(r.pubId, r.pubVersion || 0, hole, s, name).catch(e => {
    console.warn("[Tiny Tees] Couldn't save record:", e);
    if (round === r){ r.placeMsg = "Couldn't save your record (the map may have just been updated)."; const el = document.getElementById("recMsg"); if (el) el.textContent = r.placeMsg; }
  });
}
function recordsBlock(hole, title = "🏆 Hole records"){
  const com = community(), me = com && com.uid;
  let inner;
  if (!round.records) inner = round.recordsOk === false ? `<div class="muted">Couldn't load records.</div>` : `<div class="muted">Loading records…</div>`;
  else {
    const top = (round.records[hole] || []).slice(0, 3);
    inner = top.length ? top.map((x, i) => `<div class="rec ${x.uid === me ? "me" : ""}"><span>${MEDALS[i]}</span><b>${esc(x.name)}</b><span>${x.strokes} stroke${x.strokes === 1 ? "" : "s"}</span></div>`).join("")
      : `<div class="muted">No records yet</div>`;
  }
  return `<div class="records"><div class="sub">${title.startsWith("🏆") ? title : "🏆 " + title}</div>${inner}
    ${round.placeMsg ? `<div class="recmsg" id="recMsg">${esc(round.placeMsg)}</div>` : `<div id="recMsg"></div>`}</div>`;
}

async function publishCourse(c){
  const com = community(); if (!com || publishCourse.busy) return;
  publishCourse.busy = true;
  try { await publishCourseInner(c, com); } finally { publishCourse.busy = false; }
}
async function publishCourseInner(c, com){
  if (!save.creator.trim()) return toast("Add your creator name first (top of My maps)");
  for (const [i, h] of c.holes.entries()){
    const w = holeWarnings(h).filter(x => /can't be reached|inside a hazard|tee is inside/.test(x));
    if (w.length) return toast(`Hole ${i+1}: ${w[0]}`);
  }
  c.author = save.creator.trim().slice(0, 24);
  const payload = {
    name:c.name, nameLower:c.name.toLowerCase(), emoji:c.emoji, author:c.author, holes:c.holes.length,
    theme:{ fair:c.theme.fair, rail:c.theme.rail, rough:c.theme.rough, style:c.theme.style },
    data:JSON.stringify(stripCourse(c)),
  };
  if (payload.data.length > 190000) return toast("This map is too big to publish");
  const hash = strHash(payload.data + "|" + payload.name + "|" + payload.emoji + "|" + payload.author);
  if (c.pubId && c.pubHash === hash) return toast("No changes since you last published it 👍");
  toast(c.pubId ? "Updating…" : "Publishing…");
  try {
    await com.ready;
    if (c.pubId){
      try { await com.update(c.pubId, payload); }
      catch(e){ delete c.pubId; c.pubId = await com.publish(payload); }   // removed or not ours anymore → publish fresh
    } else c.pubId = await com.publish(payload);
    c.pubHash = hash;
    persist(); comItems = null;
    toast(c.pubId ? "Published to Community 🌐" : "Done");
    showHub();
  } catch(e){ toast("Publish failed: " + (e.message || e)); }
}

    b.disabled = true; b.textContent = "❤️";
    try { await com.like(d.id); save.liked[d.id] = true; persist(); const m = (comItems || []).find(x => x.id === d.id); if (m) m.likes = (+m.likes || 0) + 1; refreshComList(); }
    catch(e){ save.liked[d.id] = true; persist(); refreshComList(); }
  },
  comRemix:   async d => {
    try { const { c } = await fetchComCourse(d.id); c.name = (c.name + " (remix)").slice(0, 40); save.maps.unshift(c); persist(); hubTab = "mine"; toast("Copied to My maps ✓"); showHub(); }
    catch(e){ toast("Couldn't load map: " + (e.message || e)); }
  },
  comUnpublish: async (d, b) => {
    if (b.dataset.armed !== "1"){ b.dataset.armed = "1"; b.textContent = "Remove?"; b.classList.remove("ghost"); return; }
    try { await community().remove(d.id); save.maps.forEach(c => { if (c.pubId === d.id) delete c.pubId; }); persist(); comItems = null; toast("Removed from Community"); showHub(); }
    catch(e){ toast("Couldn't remove: " + (e.message || e)); }
  },
  edit:       () => backToEditor(),
  restartHole:() => restartHole(),
  themeDone:  () => { hideOverlay(); edCommit(); },
});

// ---- open shared links on page load ----
async function handleHash(){
  const hsh = location.hash;
  if (!hsh) return;
  const clear = () => history.replaceState(null, "", location.pathname + location.search);
  const m = hsh.match(/^#map=([A-Za-z0-9_-]+)/), p = hsh.match(/^#pub=([A-Za-z0-9_-]{1,40})/);
  if (m){
    clear();
    try { showImportPreview(await decodeCourse(m[1]), "shared link"); }
    catch(e){ toast("That map link is broken or incomplete."); }
  } else if (p){
    clear();
    const com = community();
    if (!com){ toast("Community maps aren't set up on this site."); return; }
    try { const { m, c } = await fetchComCourse(p[1]); pendingImportPub = p[1]; pendingImportVersion = +m.version || 0; showImportPreview(c, "Community"); }
    catch(e){ toast("Couldn't load that map: " + (e.message || e)); }
  }
}
let pendingImportPub = null, pendingImportVersion = 0;
window.addEventListener("hashchange", handleHash);

// =====================================================================
//  Input
// =====================================================================
function toLogical(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H };
}
canvas.addEventListener("pointerdown", e => {
  if (ED && state === "editing"){ canvas.setPointerCapture(e.pointerId); edPointerDown(toLogical(e), e); return; }
  if (state !== "aim" || demo) return;
  const p = toLogical(e);
  drag = { sx:p.x, sy:p.y, x:p.x, y:p.y };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (ED && state === "editing"){ edPointerMove(toLogical(e), e); return; }
  if (!drag) return;
  const p = toLogical(e); drag.x = p.x; drag.y = p.y;
});
canvas.addEventListener("pointerup", () => {
  if (ED && state === "editing"){ edPointerUp(); return; }
  if (!drag) return;
  const dx = drag.sx - drag.x, dy = drag.sy - drag.y, d = Math.hypot(dx, dy);
  drag = null;
  if (state !== "aim" || d < 6) return;
  shoot(Math.min(d, MAX_DRAG) / MAX_DRAG, dx/d, dy/d);
});
canvas.addEventListener("pointercancel", () => { drag = null; if (ED && state === "editing") edPointerUp(); });
canvas.addEventListener("pointerleave", () => { if (ED) ED.hover = null; });
window.addEventListener("keydown", e => {
  if (ED && state === "editing"){ if (edKey(e)) e.preventDefault(); return; }
  if (e.key === "Escape"){ if (drag) drag = null; else showPause(); }
  if (e.key === "m" || e.key === "M"){ save.muted = !save.muted; persist(); updateHUD(); }
});

// =====================================================================
//  Sizing & loop
// =====================================================================
function resize(){
  const hud = $("hud"), editing = document.body.classList.contains("editing");
  const narrow = window.innerWidth <= 760;
  let availW = window.innerWidth - 16, extraH = 0;
  if (editing){
    if (narrow) extraH = $("edTools").getBoundingClientRect().height + 8 + window.innerHeight*0.30;
    else availW -= $("edTools").getBoundingClientRect().width + $("edPanel").getBoundingClientRect().width + 20;
  } else hud.style.width = Math.min(availW, W*2) + "px";
  const hudH = (editing ? $("edTop") : hud).getBoundingClientRect().height;
  const availH = window.innerHeight - hudH - 32 - extraH;
  const s = Math.max(0.2, Math.min(availW / W, availH / H));
  const cssW = Math.floor(W*s), cssH = Math.floor(H*s);
  const dpr = window.devicePixelRatio || 1;
  if (!editing) hud.style.width = cssW + "px";
  wrap.style.width = cssW + "px"; wrap.style.height = cssH + "px";
  canvas.style.width = cssW + "px"; canvas.style.height = cssH + "px";
  canvas.width = Math.round(cssW*dpr); canvas.height = Math.round(cssH*dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener("resize", resize);

let acc = 0, lastTime = performance.now();
function frame(now){
  acc += Math.min(0.1, (now - lastTime) / 1000); lastTime = now;
  while (acc >= DT){
    if (state !== "paused") step();
    acc -= DT;
  }
  draw();
  if (ED && state === "editing") drawEditor();
  requestAnimationFrame(frame);
}

resize();
updateHUD();
showMenu();
resize();
handleHash();
requestAnimationFrame(frame);

// Small hook for automated tests.
window.__tt = {
  get state(){ return state; }, get ball(){ return ball; }, get strokes(){ return strokes; },
  get round(){ return round; }, get level(){ return levelIdx; }, get levelObj(){ return level; }, save, WORLDS,
  shoot, step, startRound, physicsFrame, set demo(v){ demo = v; },
  get ED(){ return ED; }, openEditor, newCourse, encodeCourse, decodeCourse, sanitizeCourse, playCourse, showHub,
};
})();
</script>
